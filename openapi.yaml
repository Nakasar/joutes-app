openapi: 3.1.0
info:
  title: Joutes API
  description: >
    REST API for Joutes, a companion platform for trading card game communities
    (collection tracking, decks, news, quizzes, scanner/OCR card recognition,
    events, lairs, leagues, friends, play groups, wishlists and sell lists).
    Most endpoints require an authenticated session created via the
    `/auth/*` endpoints (Better Auth). A few write endpoints additionally
    require a specific permission (e.g. `news:update`, `scanner:ai`) or
    admin status - this is noted in each operation's description.
  version: "2.0.0"
servers:
  - url: https://joutes.app/api
    description: Production
  - url: http://localhost:3000/api
    description: Local development
tags:
  - name: Auth
    description: Authentication, OAuth2/OIDC provider and session management (Better Auth).
  - name: Collection
    description: Personal card collection, booster/pack tracking and collection completion stats.
  - name: Cubes
    description: User-built cubes - packs of cards with visibility rules and distribution statistics.
  - name: Decks
    description: Public and private deck lists linked to a game.
  - name: Docs
    description: This OpenAPI document.
  - name: Events
    description: Tournament / event calendar entries tied to lairs.
  - name: Friends
    description: Friend list, friend requests and friend codes.
  - name: Geo
    description: Place lookup backing the "near me" location fields.
  - name: Game Matches
    description: Casual game match invitations/joining.
  - name: Games
    description: Game catalog, cards, rules, policies, news, quizzes and scanner recognition per game.
  - name: Lairs
    description: Game stores / venues ("lairs") that host events.
  - name: Leagues
    description: League rankings (league CRUD itself is a server action, not a REST endpoint).
  - name: News
    description: News articles, optionally linked to a game.
  - name: Notifications
    description: A user's notification inbox, and the devices registered for push delivery.
  - name: Play Groups
    description: Shared groups for pooled collections, wishlists and sell lists.
  - name: Quizzes
    description: Quizzes, optionally linked to a game.
  - name: Sell Lists
    description: Cards a user or play group is offering for sale.
  - name: Trades
    description: >
      Card trades between two users. Only the card-list helper below is
      contractual so far; composing, joining and validating a trade are served
      by routes under `/trades` that this document does not yet describe.
      Unlike most of the API, **no `/trades` route accepts an API key**: they
      resolve the session directly, so a personal `jts_...` key is rejected
      there.
  - name: Upload
    description: Generic admin file upload to blob storage.
  - name: Users
    description: Public user profiles, and a user's public wishlists/sell list.
  - name: Wishlists
    description: Cards a user or play group is looking for.
  - name: Cron
    description: Internal scheduled jobs, protected by a shared secret. Not intended for client use.
paths:
  # ---------------------------------------------------------------- Auth
  /auth/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: >
          Catch-all segment(s) handled by Better Auth, e.g. `sign-in/email-otp`,
          `sign-out`, `session`, `oauth2/authorize`, `oauth2/token`,
          `oauth2/register`, `jwks`, passkey and email-OTP routes. The exact
          set of sub-routes is defined by the Better Auth plugins configured
          in `lib/auth.ts` (email OTP, passkey, JWT, OAuth provider, Discord
          social sign-in) and is not exhaustively enumerable here.
        schema:
          type: string
    get:
      tags: [Auth]
      summary: Better Auth catch-all (read operations)
      description: Delegates to Better Auth's internal handler (e.g. session lookup, OAuth2 authorize, JWKS).
      security: []
      responses:
        "200":
          description: Response shape depends on the Better Auth sub-route invoked.
    post:
      tags: [Auth]
      summary: Better Auth catch-all (write operations)
      description: Delegates to Better Auth's internal handler (e.g. sign-in, sign-out, OAuth2 token exchange, passkey registration).
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Body shape depends on the Better Auth sub-route invoked.
      responses:
        "200":
          description: Response shape depends on the Better Auth sub-route invoked.

  /auth/.well-known/oauth-authorization-server:
    get:
      tags: [Auth]
      summary: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      description: Framework-generated discovery document for the Better Auth OAuth provider plugin.
      security: []
      responses:
        "200":
          description: OAuth 2.0 authorization server metadata document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
                  registration_endpoint: { type: string }
                  jwks_uri: { type: string }
                  response_types_supported: { type: array, items: { type: string } }
                  grant_types_supported: { type: array, items: { type: string } }
                  scopes_supported: { type: array, items: { type: string } }

  /auth/.well-known/openid-configuration:
    get:
      tags: [Auth]
      summary: OpenID Connect Discovery document
      description: Framework-generated OIDC discovery metadata for the Better Auth OAuth provider plugin.
      security: []
      responses:
        "200":
          description: OpenID Connect discovery metadata document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
                  userinfo_endpoint: { type: string }
                  jwks_uri: { type: string }
                  response_types_supported: { type: array, items: { type: string } }
                  subject_types_supported: { type: array, items: { type: string } }
                  scopes_supported: { type: array, items: { type: string } }

  # ---------------------------------------------------------------- Collection
  /collection:
    get:
      tags: [Collection]
      summary: Get the caller's collection overview across all games
      security: [{ sessionAuth: [] }]
      parameters:
        - name: includeEmpty
          in: query
          description: When `true`, include games with 0% completion (default only shows games the user owns at least one item in).
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Collection overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/value:
    post:
      tags: [Collection]
      summary: Recompute the estimated value of the caller's whole collection
      security: [{ sessionAuth: [] }]
      description: >
        Re-prices every game the caller owns at least one card in, stores each
        game's value and returns them with their total. An explicit action:
        prices are only imported now and then, and a value dated from the last
        click reads better than a total that moves on its own.
      responses:
        "200":
          description: Values per game id, and their total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/CollectionValue" }
                  value:
                    allOf: [{ $ref: "#/components/schemas/CollectionValue" }]
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/games/{gameSlug}/value:
    parameters:
      - { name: gameSlug, in: path, required: true, schema: { type: string } }
    post:
      tags: [Collection]
      summary: Recompute the estimated value of the caller's collection for one game
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: The game's freshly computed value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: { $ref: "#/components/schemas/CollectionValue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/cards:
    get:
      tags: [Collection]
      summary: List the caller's collected cards (grouped by printing)
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: gameSlug, in: query, description: "Exact slug match only (no ObjectId fallback).", schema: { type: string } }
        - { name: setCode, in: query, schema: { type: string } }
        - { name: type, in: query, description: "Card type filter.", schema: { type: string } }
      responses:
        "200":
          description: Grouped collection cards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        setCode: { type: string }
                        collectorNumber: { type: string }
                        image: { type: string }
                        quantity: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Collection]
      summary: Add a single card to the caller's collection
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCardInput" }
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /collection/cards/{cardId}:
    parameters:
      - { name: cardId, in: path, required: true, description: "Catalog card id (not a collection entry id).", schema: { type: string } }
    get:
      tags: [Collection]
      summary: Get every owned copy of a catalog card
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Owned copies of the card.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity: { type: integer }
                  cards:
                    type: array
                    items: { $ref: "#/components/schemas/CollectionCardEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Collection]
      summary: Mark/unmark a specific collection entry as borrowed
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryId, borrowedBy]
              additionalProperties: false
              properties:
                entryId: { type: string, minLength: 1, maxLength: 100 }
                borrowedBy: { type: string, minLength: 1, maxLength: 100, nullable: true, description: "Pass null to clear." }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, borrowedBy: { type: string } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Collection]
      summary: Remove an owned copy of a catalog card
      security: [{ sessionAuth: [] }]
      parameters:
        - name: entryId
          in: query
          description: Specific collection entry id to delete. If omitted, an arbitrary matching copy is removed.
          schema: { type: string }
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /collection/games/{gameSlug}:
    parameters:
      - { name: gameSlug, in: path, required: true, description: "Game slug or Mongo ObjectId.", schema: { type: string } }
    get:
      tags: [Collection]
      summary: Get the caller's collection completion for a specific game
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 48, maximum: 96 } }
        - { name: setCode, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: search, in: query, description: "Case-insensitive substring match on card name.", schema: { type: string } }
        - { name: owned, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Game collection page with completion stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        setCode: { type: string }
                        collectorNumber: { type: string }
                        image: { type: string }
                        type: { type: string }
                        orientation: { type: string, enum: [portrait, landscape], description: "Absent means `portrait`; a landscape card is shown rotated a quarter turn." }
                        quantity: { type: integer }
                        variantsOwned: { type: integer }
                        marketPrice: { $ref: "#/components/schemas/MarketPrice" }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  setCodes: { type: array, items: { type: string } }
                  types: { type: array, items: { type: string } }
                  stats: { $ref: "#/components/schemas/GameCollectionStats" }
                  game:
                    type: object
                    properties: { id: { type: string }, name: { type: string }, slug: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/games/{gameSlug}/variants:
    parameters:
      - { name: gameSlug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Collection]
      summary: List all owned printings/variants of a card by exact name
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Array of card variants (raw array, not wrapped).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    setCode: { type: string }
                    collectorNumber: { type: string }
                    image: { type: string }
                    type: { type: string }
                    quantity: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /collection/games/{gameSlug}/export:
    parameters:
      - { name: gameSlug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Collection]
      summary: Export the caller's collection for a game as CSV
      description: >
        Returns the CSV file itself (`text/csv`, with a `Content-Disposition` filename), not JSON.
        Copies are grouped: one row per set of interchangeable copies, with a quantity — the
        collection stores one document per copy, which would otherwise mean thousands of rows.
        `format` is one of the formats the game offers: `joutes` is common to every game and
        carries every field, the others mirror a third-party tool and may drop what they have no
        column for.
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: format, in: query, description: "Defaults to `joutes`.", schema: { type: string, example: piltover-archive } }
      responses:
        "200":
          description: The CSV file.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string } }
        "400": { description: Unknown format for this game., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/games/{gameSlug}/import:
    parameters:
      - { name: gameSlug, in: path, required: true, schema: { type: string } }
    post:
      tags: [Collection]
      summary: Add copies to the caller's collection from a CSV file
      description: >
        Copies read from the file are **added**; nothing is replaced or removed, so importing the
        same file twice doubles those copies. A line the catalog cannot match is reported in
        `issues` and skipped — the rest of the file is still imported, since a third-party export
        routinely holds a few cards this catalog does not know.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, csv]
              properties:
                format: { type: string, example: piltover-archive }
                csv: { type: string, description: "Raw file contents, 5 MB at most." }
      responses:
        "200":
          description: Import summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer, description: "Copies inserted." }
                  rows: { type: integer, description: "File lines retained." }
                  issues:
                    type: array
                    items:
                      type: object
                      properties: { line: { type: integer }, message: { type: string } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: File too large, or too many copies for a single import., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/games/{gameSlug}/ownership:
    parameters:
      - { name: gameSlug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Collection]
      summary: Count owned copies of the given card names, broken down by printing
      description: >-
        For each requested card name, the number of copies the caller owns, in total
        (every catalog printing sharing that name) and per printing. Names owned in
        zero copies are simply absent from the response.
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: names, in: query, required: true, description: "Exact card name; repeat the parameter for several cards (120 max).", schema: { type: array, items: { type: string } } }
        - { name: excludeBooster, in: query, required: false, description: "Booster id whose copies are left out of the counts (they are already listed by the caller).", schema: { type: string } }
      responses:
        "200":
          description: Owned copies keyed by card name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ownership:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        total: { type: integer, description: "Copies owned, every printing of that name included." }
                        printings:
                          type: object
                          description: "Copies owned per printing, keyed by `setCode|collectorNumber`."
                          additionalProperties: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/products:
    post:
      tags: [Collection]
      summary: Add a product copy to the caller's collection
      description: >
        Adds one copy of the product and, unless refused, one entry per unit of
        its contents, each linked to the container copy. The acquisition date is
        inherited by the contents; the price is not — copying a box's price onto
        each of its miniatures would double the collection's value.
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: gameSlug, in: query, required: true, description: "A product id is only unique within a game.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionProductInput" }
      responses:
        "200":
          description: Copy added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entryId: { type: string }
                  addedContents: { type: integer }
                  missing:
                    type: array
                    items: { type: string }
                    description: "Content references missing from the catalogue; skipped rather than silently dropped."
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/products/{entryId}:
    parameters:
      - { name: entryId, in: path, required: true, description: "A single physical copy, not a product.", schema: { type: string } }
    patch:
      tags: [Collection]
      summary: Update one owned product copy
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionProductPatch" }
      responses:
        "200": { description: Copy updated. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Collection]
      summary: Remove one owned product copy
      description: >
        Removing a container copy also removes what it brought and is still
        attached to it. A copy that was detached beforehand survives.
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Copy removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  removed: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/games/{gameSlug}/products:
    get:
      tags: [Collection]
      summary: Browse a game's product catalogue, annotated with what the caller owns
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: gameSlug, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 48, maximum: 96 } }
        - { name: setCode, in: query, description: "Range / wave.", schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [box, unit, starter, bundle, accessory, book, other] } }
        - { name: edition, in: query, description: "Game edition. Defaults to the game's current edition when it has one; `all` lifts the restriction. Products without an edition attribute match no edition.", schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: "Free text, plus the card-gallery token syntax carried over to products: `faction:Rebelles points<=8 commando`. Fields are the game's own facets, plus `set` and `kind`; a token wins over the matching parameter." }
        - { name: "min_{attribute}", in: query, description: "Lower bound of a numeric facet, e.g. `min_points=8`. Keys the game does not carry are ignored.", schema: { type: number } }
        - { name: "max_{attribute}", in: query, description: "Upper bound of a numeric facet, e.g. `max_points=12`.", schema: { type: number } }
        - { name: "in_{attribute}", in: query, description: "Comma-separated values of a value facet, e.g. `in_faction=Empire,Rebelles`. Values the facet does not declare are ignored.", schema: { type: string } }
        - { name: owned, in: query, description: "Omit for everything.", schema: { type: string, enum: ["true", "false"] } }
        - { name: containers, in: query, description: "`true` for products with contents, `false` for leaves.", schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Product catalogue with ownership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductCollectionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/games/{gameSlug}/products/{productId}:
    get:
      tags: [Collection]
      summary: One product's sheet — resolved contents, owned copies, and the boxes containing it
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: gameSlug, in: path, required: true, schema: { type: string } }
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  kind: { type: string }
                  setCode: { type: string }
                  image: { type: string }
                  quantity: { type: integer }
                  content: { $ref: "#/components/schemas/ContentCompletion" }
                  contents:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string }
                        quantity: { type: integer }
                        name: { type: string }
                        image: { type: string }
                        kind: { type: string }
                        owned: { type: integer }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        paintState: { type: string }
                        sealed: { type: boolean }
                        obtainedAt: { type: string }
                        acquisitionPrice: { type: number }
                        acquisitionCurrency: { type: string }
                        fromProductEntryId: { type: string }
                        attachedCopies:
                          type: integer
                          description: >
                            Copies still attached to this one — what removing it would take
                            along. Zero for a leaf, and for a container whose contents have
                            all been detached.
                        box:
                          allOf:
                            - $ref: "#/components/schemas/ContentCompletion"
                          description: "Contents still attached to *this* copy. Present only on containers."
                  containers:
                    type: array
                    description: "Products whose contents cite this one."
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        image: { type: string }
                        kind: { type: string }
                        owned: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /collection/boosters:
    get:
      tags: [Collection]
      summary: List the caller's boosters/packs for a game
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: gameSlug, in: query, required: true, schema: { type: string } }
        - name: type
          in: query
          required: false
          description: >-
            Filter on a booster type available for the game. `other` also matches
            boosters stored without a type, and the legacy value `custom` is
            accepted as an alias of `other`; any other value is rejected.
          schema: { type: string }
        - name: cards
          in: query
          required: false
          description: >-
            Comma-separated card ids. Only boosters containing **every** listed
            card are returned. An id absent from the game's cards stays an active
            filter and simply matches nothing; duplicates are collapsed, and at
            most 10 ids are kept.
          schema: { type: string }
          example: OGN001,OGN042
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, oldest], default: newest } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: Boosters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  boosters: { type: array, items: { $ref: "#/components/schemas/Booster" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Collection]
      summary: Create an empty booster to fill in
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameSlug, setCode, lang]
              properties:
                gameSlug: { type: string }
                setCode: { type: string }
                lang: { type: string }
                type:
                  type: string
                  default: other
                  description: >-
                    Booster type. Must be one of the types available for the game
                    (`other` is always accepted); any other value is rejected.
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /collection/boosters/{boosterId}:
    parameters:
      - { name: boosterId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Collection]
      summary: Get a booster
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Booster.
          content:
            application/json:
              schema: { type: object, properties: { booster: { $ref: "#/components/schemas/Booster" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Collection]
      summary: Update a booster's details
      description: At least one of `type` or `note` must be provided; omitted fields are left unchanged.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [type]
                - required: [note]
              properties:
                type:
                  type: string
                  description: >-
                    Booster type. Must be one of the types available for the game
                    (`other` is always accepted); any other value is rejected.
                note:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: >-
                    Free-form note, trimmed before storage. `null` or an empty
                    string clears the existing note.
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  type: { type: string, description: Present only when the type was updated. }
                  note: { type: string, nullable: true, description: Present only when the note was updated; `null` when it was cleared. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Collection]
      summary: Delete a booster and its cards
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /collection/boosters/{boosterId}/cards:
    parameters:
      - { name: boosterId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Collection]
      summary: Add a card to a booster
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, setCode]
              properties:
                name: { type: string }
                setCode: { type: string }
                cardId: { type: string }
                collectorNumber: { type: string, default: "" }
                image: { type: string, default: "" }
                lang: { type: string }
                subtitle: { type: string }
                foil: { type: boolean }
      responses:
        "200": { description: Added., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Collection]
      summary: Toggle a booster card's foil status
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryId, foil]
              properties: { entryId: { type: string }, foil: { type: boolean } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Collection]
      summary: Remove a card from a booster
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: entryId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Removed., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /collection/boosters/{boosterId}/collection:
    parameters:
      - { name: boosterId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Collection]
      summary: Copy every card in a booster into the caller's main collection
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Cards added.
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean }, added: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Collection]
      summary: Remove this booster's cards from the caller's main collection
      security: [{ sessionAuth: [] }]
      description: Cascades to remove any sell-list listings referencing the removed collection entries.
      responses:
        "200": { description: Removed., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Decks
  /cubes:
    get:
      tags: [Cubes]
      summary: List the caller's cubes
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Cubes owned by the caller, whatever their visibility.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cubes: { type: array, items: { $ref: "#/components/schemas/Cube" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Cubes]
      summary: Create a cube
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, gameSlug]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                gameSlug:
                  type: string
                  description: >-
                    Game the cube belongs to. It fixes which cards can be added
                    and cannot be changed afterwards.
                description: { type: string, maxLength: 2000 }
                visibility:
                  type: string
                  enum: [private, unlisted, public]
                  default: private
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cube" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cubes/{cubeId}:
    parameters:
      - { name: cubeId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Cubes]
      summary: Get a cube and its packs
      description: >-
        A private cube answers 404 to anyone but its owner, so that the response
        does not reveal its existence.
      responses:
        "200":
          description: Cube.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cube: { $ref: "#/components/schemas/Cube" }
                  packs: { type: array, items: { $ref: "#/components/schemas/CubePack" } }
                  canEdit: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Cubes]
      summary: Update a cube
      description: At least one field must be provided. The game is not editable.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [name]
                - required: [description]
                - required: [visibility]
                - required: [draw]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description:
                  type: string
                  maxLength: 2000
                  description: An empty string clears the existing description.
                visibility: { type: string, enum: [private, unlisted, public] }
                draw: { $ref: "#/components/schemas/CubeDrawConfig" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cube" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Cubes]
      summary: Delete a cube, its packs and their cards
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cubes/{cubeId}/packs:
    parameters:
      - { name: cubeId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Cubes]
      summary: List a cube's packs
      responses:
        "200":
          description: Packs, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  packs: { type: array, items: { $ref: "#/components/schemas/CubePack" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Cubes]
      summary: Add a pack to a cube
      description: Both fields are optional - a pack with no name is displayed by its position.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                type: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CubePack" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cubes/{cubeId}/packs/{packId}:
    parameters:
      - { name: cubeId, in: path, required: true, schema: { type: string } }
      - { name: packId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Cubes]
      summary: Get a pack and its cards
      responses:
        "200":
          description: Pack.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack: { $ref: "#/components/schemas/CubePack" }
                  cards: { type: array, items: { $ref: "#/components/schemas/CubeCard" } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Cubes]
      summary: Update a pack's name or type
      description: An empty string clears the corresponding field.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [name]
                - required: [type]
              properties:
                name: { type: string, maxLength: 100 }
                type: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CubePack" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Cubes]
      summary: Delete a pack and its cards
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cubes/{cubeId}/packs/{packId}/cards:
    parameters:
      - { name: cubeId, in: path, required: true, schema: { type: string } }
      - { name: packId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Cubes]
      summary: Add a card to a pack
      description: >-
        The same card may be added several times: a pack holds copies, not a set.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId, name, setCode, collectorNumber, image]
              properties:
                cardId: { type: string }
                name: { type: string }
                setCode: { type: string }
                collectorNumber: { type: string }
                image: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CubeCard" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Cubes]
      summary: Set how many copies of a card a pack holds
      description: >-
        Reconciles the pack with the wanted quantity by adding or removing
        entries, rather than clearing and reinserting them. A quantity of 0
        removes the card from the pack. Copies are matched by `cardId`.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId, name, setCode, collectorNumber, image, quantity]
              properties:
                cardId: { type: string }
                name: { type: string }
                setCode: { type: string }
                collectorNumber: { type: string }
                image: { type: string }
                quantity: { type: integer, minimum: 0, maximum: 99 }
      responses:
        "200":
          description: The pack's cards after the change, one entry per copy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards: { type: array, items: { $ref: "#/components/schemas/CubeDrawnCard" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Cubes]
      summary: Remove one card entry from a pack
      security: [{ sessionAuth: [] }]
      parameters:
        - name: entryId
          in: query
          required: true
          description: Id of the card entry to remove, not the card id - a pack may hold several copies.
          schema: { type: string }
      responses:
        "200": { description: Removed., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cubes/{cubeId}/packs/{packId}/import:
    parameters:
      - { name: cubeId, in: path, required: true, schema: { type: string } }
      - { name: packId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Cubes]
      summary: Import a card list into a pack
      description: >-
        Each line reads as `2x Card name #SET001`, where the quantity and the
        `#setCode+collectorNumber` printing code are optional. Blank lines and
        lines starting with `//` or `#` are ignored. Cards are matched against
        the game's catalogue by name, the printing code picking between
        reprints; a line whose name is unknown is matched on its printing code
        alone. Lines that match nothing are reported back rather than failing
        the whole import, and a list that matches nothing at all leaves the pack
        untouched.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 50000 }
                mode:
                  type: string
                  enum: [append, replace]
                  default: append
                  description: "`append` adds to the pack, `replace` empties it first."
      responses:
        "200":
          description: The pack's cards after the import, one entry per copy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer, description: Copies actually written. }
                  unresolved:
                    type: array
                    description: Lines whose card is absent from the game's catalogue.
                    items: { type: string }
                  invalidLines:
                    type: array
                    description: Lines the format does not cover.
                    items: { type: string }
                  cards: { type: array, items: { $ref: "#/components/schemas/CubeDrawnCard" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cubes/{cubeId}/export:
    parameters:
      - { name: cubeId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Cubes]
      summary: Export the whole cube as a card list
      description: >-
        Every pack in order, each announced by a `// pack name` comment and
        followed by its cards as `2x Card name #SET001`. Comments being ignored
        on import, the text can be pasted back into a pack. Open to anyone who
        can view the cube.
      security: []
      responses:
        "200":
          description: The cube as text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /cubes/{cubeId}/draw:
    parameters:
      - { name: cubeId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Cubes]
      summary: Draw the cube for a number of players
      description: >-
        Open to anonymous callers: only the cube's visibility gates access. The
        cube's stored configuration is used, falling back to the defaults (one
        pack per player, no duplicates) when it has none. Nothing is persisted -
        each call is an independent draw.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [players]
              properties:
                players: { type: integer, minimum: 1, maximum: 16 }
      responses:
        "200":
          description: One draw per player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CubeDrawResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /decks:
    get:
      tags: [Decks]
      summary: Search decks
      security: []
      parameters:
        - { name: playerId, in: query, schema: { type: string } }
        - { name: gameId, in: query, schema: { type: string } }
        - name: visibility
          in: query
          description: >
            Repeatable: `?visibility=private&visibility=unlisted` is how a
            player asks for their own work in progress. `unlisted` is only
            accepted together with `scope=mine` - a deck reachable by link is
            not asked for in bulk, not even by its author, who finds it among
            their decks.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [private, unlisted, public] }
        - { name: search, in: query, description: "Regex match on name/description.", schema: { type: string } }
        - { name: format, in: query, description: "Exact play format, as declared on the deck.", schema: { type: string } }
        - { name: legendCardId, in: query, description: "Decks built around this legend. Values come from `GET /decks/legends`.", schema: { type: string } }
        - name: domain
          in: query
          description: "Repeatable. A deck matches when it covers every domain asked for."
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - { name: sortBy, in: query, schema: { type: string, enum: [name, createdAt, updatedAt, favoritesCount, views], default: updatedAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - name: scope
          in: query
          description: >
            `mine` for the caller's own decks whatever their visibility, `public`
            for the library (never returns `unlisted`), `all` for everything the
            caller may see. Without any of `scope`, `playerId` and `visibility`,
            only public decks are returned.
          schema: { type: string, enum: [mine, all, public] }
        - { name: favoritesOnly, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: >
            Paginated decks. Requesting another user's private decks (via
            `playerId` + `visibility=private`) is rejected; asking for
            `visibility=unlisted` outside `scope=mine` is a 400.
          content:
            application/json:
              schema:
                type: object
                properties:
                  decks: { type: array, items: { $ref: "#/components/schemas/Deck" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Decks]
      summary: Create a deck
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, gameId]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                gameId: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
                url: { type: string, format: uri }
                description: { type: string, maxLength: 2000 }
                decklist: { type: string, maxLength: 20000 }
                cards: { $ref: "#/components/schemas/DeckCards" }
                guide: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/DeckGuideSection" } }
                matchups: { type: array, maxItems: 40, items: { $ref: "#/components/schemas/DeckMatchup" } }
                notes: { type: string, maxLength: 4000 }
                format: { type: string, maxLength: 80 }
                legendCardId: { type: string, maxLength: 200 }
                coverCardId:
                  type: string
                  maxLength: 200
                  description: "A card of the deck, chosen to illustrate it. Absent, the legend serves as the cover."
                coverImageUrl:
                  type: string
                  format: uri
                  maxLength: 2000
                  description: >
                    A cover image uploaded through `POST /decks/{deckId}/cover`;
                    it wins over `coverCardId`. Only addresses on the
                    application's own blob storage are accepted - an arbitrary
                    host is rejected.
                visibility: { type: string, enum: [private, unlisted, public], default: private }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Deck" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "A deck with this name already exists for this player.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /decks/{deckId}:
    parameters:
      - { name: deckId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" } }
    get:
      tags: [Decks]
      summary: Get a deck
      security: []
      description: >
        Private decks are only visible to their owner (session optional;
        checked if present). `notes` is stripped for any caller other than the
        author.
      responses:
        "200": { description: Deck., content: { application/json: { schema: { $ref: "#/components/schemas/Deck" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Decks]
      summary: Update a deck, or toggle favorite status
      security: [{ sessionAuth: [] }]
      description: >
        Two modes based on body shape: send `{ "favorite": boolean }` to toggle the
        caller's favorite on the deck, or any subset of the deck fields to update
        the deck itself (only the owner may do either).


        **Optimistic concurrency.** Every save bumps the deck's `version`. Send
        `expectedVersion` alongside the fields you are saving and the write only
        applies while the deck is still the one you read: if someone saved in
        between, nothing is written and the answer is `409` with `error:
        "conflict"` and the deck that got there first, so the client can
        resynchronise without a second round trip. Omit `expectedVersion` and the
        write is last-one-wins, as it has always been.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [favorite]
                  properties: { favorite: { type: boolean } }
                - type: object
                  minProperties: 1
                  properties:
                    name: { type: string, minLength: 1, maxLength: 100 }
                    gameId: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
                    url: { type: string }
                    description: { type: string, maxLength: 2000 }
                    decklist: { type: string, maxLength: 20000 }
                    cards: { $ref: "#/components/schemas/DeckCards" }
                    guide: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/DeckGuideSection" } }
                    matchups: { type: array, maxItems: 40, items: { $ref: "#/components/schemas/DeckMatchup" } }
                    notes: { type: string, maxLength: 4000 }
                    format: { type: string, maxLength: 80 }
                    legendCardId: { type: string, maxLength: 200 }
                    coverCardId:
                      type: string
                      maxLength: 200
                      description: >
                        A card of the deck, chosen to illustrate it. The empty
                        string clears the choice and hands the cover back to the
                        legend.
                    coverImageUrl:
                      description: >
                        A cover image uploaded through
                        `POST /decks/{deckId}/cover`; it wins over `coverCardId`.
                        Only addresses on the application's own blob storage are
                        accepted. The empty string removes it - hence the two
                        branches: the field is not always a URI.
                      oneOf:
                        - { type: string, format: uri, maxLength: 2000 }
                        - { type: string, enum: [""] }
                    visibility: { type: string, enum: [private, unlisted, public] }
                    expectedVersion:
                      type: integer
                      minimum: 1
                      description: >
                        The `version` the caller last read. Guards the write
                        against a concurrent save; it is never stored, and does
                        not on its own count as a field to update.
      responses:
        "200": { description: Updated deck., content: { application/json: { schema: { $ref: "#/components/schemas/Deck" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Either the name collides with an existing deck of the same player,
            or `expectedVersion` was stale. The stale-version answer carries
            `error: "conflict"` and `deck`, the state that got there first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      deck: { $ref: "#/components/schemas/Deck" }
    delete:
      tags: [Decks]
      summary: Delete a deck (owner only)
      security: [{ sessionAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /decks/{deckId}/copy:
    parameters:
      - { name: deckId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" } }
    post:
      tags: [Decks]
      summary: Copy a deck into the caller's own decks
      description: >
        Only reachable decks can be copied: another player's private deck cannot,
        and an unlisted one only by whoever has its link - so, by someone already
        on its page. **The copy lands `private`**: publishing someone else's list
        is a decision, not a side effect.
      security: [{ sessionAuth: [] }]
      responses:
        "201": { description: The new deck., content: { application/json: { schema: { $ref: "#/components/schemas/Deck" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /decks/{deckId}/cover:
    parameters:
      - { name: deckId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" } }
    post:
      tags: [Decks]
      summary: Upload a cover image for a deck
      description: >
        Reserved to the deck's author. `multipart/form-data`, field `file`
        (JPG/PNG/WebP/GIF, max 5 MB). The route only stores the file and returns
        its address: it is a `PATCH /decks/{deckId}` with `coverImageUrl` that
        puts it on the deck.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        "200": { description: Uploaded., content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /decks/legends:
    get:
      tags: [Decks]
      summary: Legends played by published decks
      description: >
        Feeds the library's legend filter. The list comes from what is actually
        published, not from the card catalog: offering three hundred legends of
        which none has a deck would not make a filter. Public decks only, at
        most 200 entries, most played first.
      security: []
      parameters:
        - { name: gameId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Legends and their deck counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  legends: { type: array, items: { $ref: "#/components/schemas/DeckLegendFacet" } }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Docs
  /docs:
    get:
      tags: [Docs]
      summary: Get this OpenAPI document as JSON
      security: []
      responses:
        "200":
          description: The static `openapi.json` document served as-is.

  # ---------------------------------------------------------------- Geo
  /geo/places:
    get:
      tags: [Geo]
      summary: Search places by city name or postcode
      description: |
        Autocompletion for the location fields ("near me", account location). Relays to Photon (Komoot's OpenStreetMap-backed geocoder) server-side, which lets the app send the `User-Agent` that service asks for and cache the answers — the same towns come up from one visitor to the next.

        Open to anonymous callers, like the near-me event search it serves. Queries shorter than 2 or longer than 120 characters return an empty list rather than an error.
      security: []
      parameters:
        - { name: q, in: query, required: true, description: City name or postcode., schema: { type: string, minLength: 2, maxLength: 120 } }
        - { name: lang, in: query, required: false, description: "Result language. `de`, `en`, `fr` and `it` are honoured; anything else falls back to the local language." , schema: { type: string } }
      responses:
        "200":
          description: Matching places, deduplicated by label, at most 6.
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, description: Stable key for list rendering., example: "R:120965" }
                        label: { type: string, example: "Lyon (69000), Auvergne-Rhône-Alpes, France" }
                        city: { type: string, nullable: true, example: "Lyon" }
                        postalCode: { type: string, nullable: true, example: "69000" }
                        latitude: { type: number, example: 45.764 }
                        longitude: { type: number, example: 4.8357 }
        "502": { description: The upstream geocoder is unreachable or errored. }

  # ---------------------------------------------------------------- Events
  /events:
    get:
      tags: [Events]
      summary: List events (calendar)
      security: []
      description: >
        Behavior depends on inputs: `lairId` scopes to one lair; an authenticated
        session returns events for the user's followed games (or `gameId`);
        an anonymous request with `userLat`/`userLon`/`maxDistance` searches
        nearby lairs; otherwise an anonymous request with no location returns
        an empty list.
      parameters:
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 3000 } }
        - { name: gameId, in: query, description: "Game id, or the special value `followed`.", schema: { type: string, default: followed } }
        - { name: lairId, in: query, description: "Scopes to one lair. The lair's privacy gate applies: a private lair is only readable by a follower, its team or an admin — anyone else gets 404, never 403.", schema: { type: string } }
        - { name: userLat, in: query, schema: { type: number } }
        - { name: userLon, in: query, schema: { type: number } }
        - { name: maxDistance, in: query, description: "Max distance in km, must be > 0.", schema: { type: number } }
        - { name: afterDate, in: query, description: "ISO date-time lower bound on startDateTime, independent of month/year. Only applied for an authenticated request (ignored for the lairId-scoped and anonymous-geospatial branches).", schema: { type: string, format: date-time } }
        - { name: beforeDate, in: query, description: "ISO date-time upper bound on startDateTime, independent of month/year. Only applied for an authenticated request (ignored for the lairId-scoped and anonymous-geospatial branches).", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                properties: { events: { type: array, items: { $ref: "#/components/schemas/Event" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /events/{eventId}:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Events]
      summary: Get an event's detail
      description: Resolves an id already known to the caller (e.g. from a previous list call). A private event (no `lairId`) is only visible to its creator or a participant, same access model as the `/events/{eventId}` web page.
      security: [{ sessionAuth: [] }, {}]
      responses:
        "200": { description: Event., content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /events/{eventId}/favorite:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Events]
      summary: Toggle the caller's favorite on an event
      description: Same private-event access restriction as `GET /events/{eventId}` — favoriting doesn't grant visibility into an event the caller can't otherwise see.
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Updated favorite state., content: { application/json: { schema: { type: object, properties: { favorited: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /events/{eventId}/favorited-users:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Events]
      summary: List users who favorited an event (organizer/lair-owner only)
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Favoriting users.
          content:
            application/json:
              schema:
                type: object
                properties: { users: { type: array, items: { $ref: "#/components/schemas/PublicUser" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Friends
  /friends:
    get:
      tags: [Friends]
      summary: List the caller's friends
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Friends., content: { application/json: { schema: { type: object, properties: { friends: { type: array, items: { $ref: "#/components/schemas/PublicUser" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Friends]
      summary: Send a friend request by username or displayName#discriminator tag
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [username], properties: { username: { type: string } } }
      responses:
        "201": { description: Request created., content: { application/json: { schema: { type: object, properties: { friendRequest: { $ref: "#/components/schemas/FriendRequest" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already friends, or a request is already pending.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /friends/{friendId}:
    parameters:
      - { name: friendId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Friends]
      summary: Remove a friend (bidirectional)
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Removed., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /friends/code:
    get:
      tags: [Friends]
      summary: Get (or lazily create) the caller's own friend code
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Friend code., content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /friends/scan:
    post:
      tags: [Friends]
      summary: Add a friend immediately by scanning/entering their friend code
      description: Unlike `POST /friends`, this adds the friendship immediately (no accept step) and also auto-resolves any pending request between the two users.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string, description: "8 characters from [23456789ABCDEFGHJKMNPQRSTUVWXYZ]." } }
      responses:
        "200": { description: Friend added., content: { application/json: { schema: { type: object, properties: { friend: { $ref: "#/components/schemas/PublicUser" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already friends., content: { application/json: { schema: { type: object, properties: { error: { type: string }, friend: { $ref: "#/components/schemas/PublicUser" } } } } } }

  /friends/requests:
    get:
      tags: [Friends]
      summary: List pending incoming friend requests
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Pending requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/FriendRequest" }
                        - type: object
                          properties: { requester: { $ref: "#/components/schemas/PublicUser" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /friends/requests/{requestId}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Friends]
      summary: Accept a pending friend request (recipient only)
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Accepted., content: { application/json: { schema: { type: object, properties: { friendRequest: { $ref: "#/components/schemas/FriendRequest" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Friends]
      summary: Decline a pending friend request (recipient only)
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Declined., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Game Matches
  /game-matches:
    get:
      tags: [Game Matches]
      summary: The caller's casual matches, most recent first
      description: >
        "Their" matches in the broad sense: the ones they created as well as the
        ones someone else signed them up for. The battle report is trimmed to its
        scenario here — army lists and the game table are only served on the
        match sheet.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: gameId, in: query, description: "Game ObjectId.", schema: { type: string } }
        - { name: from, in: query, description: "Played on or after this day (`YYYY-MM-DD`).", schema: { type: string } }
        - { name: to, in: query, description: "Played on or before this day, that day included.", schema: { type: string } }
      responses:
        "200":
          description: Matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches: { type: array, items: { $ref: "#/components/schemas/GameMatchSummary" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /game-matches/{matchId}:
    parameters:
      - { name: matchId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Game Matches]
      summary: One match, battle report included
      description: "Restricted to those who were there: its creator and its players."
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: Match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameMatchDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /game-matches/{matchId}/battle-map:
    parameters:
      - { name: matchId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Game Matches]
      summary: Write the game table of a battle report
      description: >
        Written as a whole, unlike the scenario and the notes: the pieces of the
        table hold one another, and a terrain moved without its instant means
        nothing. Creator only — the table is a single drawing, and two players
        moving tokens in the same instant would reposition the whole game rather
        than overwrite one field. What sticks out is brought back, not refused:
        tokens are clamped onto the board and terrain, tokens and instants are
        capped, so a report never becomes unsaveable because its table shrank.
        The normalized table is returned.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [map]
              properties: { map: { $ref: "#/components/schemas/BattleMap" } }
      responses:
        "200":
          description: Table written.
          content:
            application/json:
              schema:
                type: object
                required: [map]
                properties: { map: { $ref: "#/components/schemas/BattleMap" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /game-matches/{matchId}/join:
    parameters:
      - { name: matchId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Game Matches]
      summary: Join a casual game match via an invite link
      description: >
        Browser-navigation endpoint (not meant to be called via XHR/fetch): always
        responds with an HTTP redirect, never JSON. Redirects to `/login` if not
        authenticated, otherwise to the match page with a French success/error
        message in the query string.
      security: [{ sessionAuth: [] }]
      responses:
        "302":
          description: >
            Redirect to `/login?callbackUrl=...` (not authenticated), or to
            `/game-matches/{matchId}?message=...` / `/game-matches?error=...`
            depending on outcome.
    post:
      tags: [Game Matches]
      summary: The same move, in JSON
      description: >
        For clients that scan the invite QR code without a browser. Joining twice
        is not an error — the QR code stays on screen and gets scanned again:
        `joined` is then `false`, and the match is returned either way.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: Joined, or already a player.
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined: { type: boolean }
                  match: { $ref: "#/components/schemas/GameMatchDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /tournaments/playing:
    get:
      tags: [Tournaments]
      summary: Tournaments the caller is registered in
      description: >
        Unlike the sync-key endpoint, no secret is required: a session (or API
        key) is enough. **Two response shapes, deliberately.** With no query
        parameter the full list is returned as a bare array, the way it always
        was, for clients already installed. As soon as a page or a filter is
        asked for, the response becomes a paginated envelope. In that mode
        tournaments **in progress come first** — they are the only thing anyone
        looks for on the day, and a pagination that buried them would miss its
        point. A date filter only keeps tournaments that carry a date.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, description: "Case-insensitive match on the tournament name.", schema: { type: string } }
        - { name: status, in: query, description: "Comma-separated statuses to keep. Absent = all.", schema: { type: string, example: "draft,in-progress" } }
        - { name: gameId, in: query, schema: { type: string } }
        - { name: from, in: query, description: "Starts on or after this day (`YYYY-MM-DD`)." , schema: { type: string } }
        - { name: to, in: query, description: "Starts on or before this day, that day included.", schema: { type: string } }
      responses:
        "200":
          description: Tournaments, as an array (no parameters) or a paginated envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        tournament: { type: object }
                        player: { type: object }
                  - type: object
                    properties:
                      tournaments:
                        type: array
                        items:
                          type: object
                          properties:
                            tournament: { type: object }
                            player: { type: object }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- Games
  /games:
    get:
      tags: [Games]
      summary: List games (catalog)
      security: []
      description: Returns up to 25 games with a lightweight projection; no pagination/filtering supported.
      responses:
        "200":
          description: Games.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GameSummary" }

  /games/{gameId}:
    parameters:
      - { name: gameId, in: path, required: true, description: "Game slug or Mongo ObjectId.", schema: { type: string } }
    get:
      tags: [Games]
      summary: Get a game
      security: []
      responses:
        "200": { description: Game., content: { application/json: { schema: { $ref: "#/components/schemas/Game" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /games/{gameId}/cards:
    parameters:
      - { name: gameId, in: path, required: true, description: "Game slug; used as a Meilisearch index key.", schema: { type: string } }
    get:
      tags: [Games]
      summary: Search a game's card catalog (Meilisearch-backed)
      security: []
      description: >
        Response is a bare array unless `page` or `limit` is supplied, in which
        case it becomes a paginated object including facet lists. `searchQuery`
        supports inline directives: `set:<code>` / `e:<code>` to filter by set
        (overrides `setCode`; `set:*` disables set filtering), and
        `cn:<code>` to filter by exact collector number.


        Game attributes can also be filtered and sorted on. The attributes a game actually has are
        returned as `facets`; anything outside them is ignored rather than passed to the search engine.
        Numeric attributes take `min_<attr>` / `max_<attr>` (inverted bounds are swapped), value
        attributes take `in_<attr>` as a comma-separated list (values within one attribute are OR-ed,
        attributes are AND-ed). `sort` is `<key>:asc|desc` over `name`, `collectorNumber` or any numeric
        attribute.


        Filtering and sorting require the attribute to be declared on the Meilisearch index, which the
        admin "update index" action does. Until it has run for a game, the search falls back to
        returning results without those criteria and sets `filtersUnavailable`.
      parameters:
        - { name: setCode, in: query, schema: { type: string } }
        - { name: searchQuery, in: query, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, default: all } }
        - { name: type, in: query, schema: { type: string } }
        - { name: sort, in: query, description: "`<key>:asc|desc`.", schema: { type: string } }
        - { name: "min_{attribute}", in: query, description: "Lower bound of a numeric attribute.", schema: { type: number } }
        - { name: "max_{attribute}", in: query, description: "Upper bound of a numeric attribute.", schema: { type: number } }
        - { name: "in_{attribute}", in: query, description: "Comma-separated values of a value attribute.", schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 24, maximum: 100 } }
      responses:
        "200":
          description: Cards, or a paginated result if `page`/`limit` is present.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/BoosterCard" }
                  - type: object
                    properties:
                      cards: { type: array, items: { $ref: "#/components/schemas/BoosterCard" } }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      totalPages: { type: integer }
                      setCodes: { type: array, items: { type: string } }
                      types: { type: array, items: { type: string } }
                      languages: { type: array, items: { type: string } }
                      facets: { type: array, items: { $ref: "#/components/schemas/CardFilterFacet" } }
                      filtersUnavailable:
                        type: boolean
                        description: "The index does not accept attribute filters yet; the results ignore them."

  /games/{gameId}/cards/{cardId}:
    parameters:
      - { name: gameId, in: path, required: true, description: "Game slug (exact match only).", schema: { type: string } }
      - { name: cardId, in: path, required: true, description: "Card's own `id` field, scoped to the resolved game.", schema: { type: string } }
    get:
      tags: [Games]
      summary: Get a card's detail, including its erratas
      security: []
      description: Session is optional; if present, `userVote` is populated on each errata.
      responses:
        "200":
          description: Card detail with erratas and mentioned-card lookups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BoosterCard"
                  - type: object
                    properties:
                      game: { type: object, properties: { id: { type: string }, name: { type: string }, slug: { type: string } } }
                      erratas: { type: array, items: { $ref: "#/components/schemas/Errata" } }
                      cardIdByName: { type: object, additionalProperties: { type: string } }
                      cardsById: { type: object, additionalProperties: { $ref: "#/components/schemas/CardNameMatch" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /games/{gameId}/deck-cards:
    parameters:
      - { name: gameId, in: path, required: true, description: "Game slug or id.", schema: { type: string } }
    get:
      tags: [Decks]
      summary: Resolve a deck's cards against the game catalog
      description: >
        What a deck needs to show its contents: the catalog entry behind each
        `cardId`. `id` is repeatable and also accepts a comma-separated list;
        at most 500 ids per call - the size of a very large deck, not of an
        import.
      security: []
      parameters:
        - name: id
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
      responses:
        "200":
          description: The cards that were found. An unknown id simply has no entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards: { type: array, items: { $ref: "#/components/schemas/DeckCardInfo" } }
        "400": { description: "More than 500 ids asked for.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Decks]
      summary: Resolve card names against the game catalog
      description: >
        The other half of the same need: turning a pasted list into deck
        contents. Names are matched without case or diacritics, since a list
        copied by hand does not always carry them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names: { type: array, maxItems: 1000, items: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        "200":
          description: >
            Matches keyed by the name **as it was sent**, not as the card is
            spelled in the catalog - the caller matched on its own text, and
            the two can differ by an accent. A name with no match has no key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/DeckCardInfo" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /games/{gameId}/deck-checker:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Games]
      summary: Validate/parse a Riftbound deck list
      security: []
      description: Only supported for the game whose slug is `riftbound`. Accepts a Piltover Archive deck URL, a Piltover deck code, or a raw pasted deck list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [deckList], properties: { deckList: { type: string } } }
      responses:
        "200":
          description: Parsed deck.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deck: { $ref: "#/components/schemas/RiftboundDeckList" }
                  link: { type: string }
                  code: { type: string }
        "400": { $ref: "#/components/responses/NestedValidationError" }
        "404": { $ref: "#/components/responses/NestedNotFound" }
        "500": { description: Failed to verify decklist., content: { application/json: { schema: { $ref: "#/components/schemas/NestedError" } } } }

  /games/{gameId}/erratas:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Games]
      summary: List a game's erratas
      security: []
      description: >
        Every errata attached to a card of this game. Session is optional; if
        present, `votes.userVote` is populated. Response body is a raw array;
        pagination totals are returned via the `x-page`, `x-page-size` and
        `x-count` response headers instead of the body.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Erratas.
          headers:
            x-page: { schema: { type: string } }
            x-page-size: { schema: { type: string } }
            x-count: { schema: { type: string } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Errata" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Games]
      summary: Submit an errata
      description: >
        Open to any signed-in user — erratas are community content, arbitrated by
        votes and reports. Every `cardIds` entry must be an existing card **of this
        game**, at most 20 of them. `errataDate` defaults to now.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardIds, type, details]
              properties:
                cardIds: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
                type: { type: string, enum: [errata, clarification, ruling] }
                details: { type: string, maxLength: 5000 }
                originalLang: { type: string, enum: [en, fr, it, de], default: fr }
                source: { type: string, maxLength: 500 }
                errataDate: { type: string, format: date-time }
      responses:
        "201":
          description: Created errata.
          content: { application/json: { schema: { $ref: "#/components/schemas/Errata" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /games/{gameId}/erratas/{errataId}/vote:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
      - { name: errataId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Games]
      summary: Vote on an errata
      description: >
        Casting the same vote again removes it. Voting is open to any signed-in
        user (implicit `erratas:vote` permission).
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vote]
              properties: { vote: { type: string, enum: [positive, negative] } }
      responses:
        "200":
          description: Updated tally.
          content:
            application/json:
              schema:
                type: object
                properties:
                  votes:
                    type: object
                    properties: { positive: { type: integer }, negative: { type: integer }, userVote: { type: string, enum: [positive, negative] } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /games/{gameId}/loop:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Games]
      summary: Auto-link recognized card names in free text ("Loupe")
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string, maxLength: 20000 } }
      responses:
        "200":
          description: Annotated text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw: { type: string }
                  annotated: { type: string }
                  cards:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CardNameMatch"
                        - type: object
                          properties: { erratas: { type: array, items: { $ref: "#/components/schemas/Errata" } } }
        "400": { $ref: "#/components/responses/NestedValidationError" }
        "404": { $ref: "#/components/responses/NestedNotFound" }

  /games/{gameId}/news:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Games]
      summary: List news linked to a game
      security: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: Paginated news.
          content:
            application/json:
              schema:
                type: object
                properties:
                  news: { type: array, items: { $ref: "#/components/schemas/News" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /games/{gameId}/policies:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Games]
      summary: List/search a game's rulings & policies
      security: []
      description: >
        Response body is a raw array; pagination totals are returned via the
        `x-page`, `x-page-size` and `x-count` response headers instead of the body.
      parameters:
        - { name: searchQuery, in: query, description: "Full-text search on title/content.", schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: Policies.
          headers:
            x-page: { schema: { type: string } }
            x-page-size: { schema: { type: string } }
            x-count: { schema: { type: string } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Policy" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Games]
      summary: Create a policy for a game
      description: >
        Requires permission `policies:update` — unlike erratas, policies carry
        authority and are not arbitrated by votes.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, maxLength: 200 }
                content: { type: string, maxLength: 20000 }
                originalLang: { type: string, enum: [en, fr, it, de], default: fr }
                source: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Created policy.
          content: { application/json: { schema: { $ref: "#/components/schemas/Policy" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /games/{gameId}/policies/{policyId}:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
      - { name: policyId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Games]
      summary: Get a single policy's detail
      security: []
      description: Session is optional; if present, `votes.userVote` is populated.
      responses:
        "200":
          description: Policy detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404": { $ref: "#/components/responses/NotFound" }

  /games/{gameId}/policies/{policyId}/vote:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
      - { name: policyId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Games]
      summary: Vote on a policy
      description: >
        Casting the same vote again removes it. Voting is open to any signed-in
        user (implicit `policies:vote` permission).
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vote]
              properties: { vote: { type: string, enum: [positive, negative] } }
      responses:
        "200":
          description: Updated tally.
          content:
            application/json:
              schema:
                type: object
                properties:
                  votes:
                    type: object
                    properties: { positive: { type: integer }, negative: { type: integer }, userVote: { type: string, enum: [positive, negative] } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /games/{gameId}/quizzes:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Games]
      summary: List quizzes linked to a game
      security: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: Paginated quizzes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quizzes: { type: array, items: { $ref: "#/components/schemas/Quiz" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /games/{gameId}/rules:
    parameters:
      - { name: gameId, in: path, required: true, description: "Game slug (only `riftbound` is currently supported).", schema: { type: string } }
    get:
      tags: [Games]
      summary: Get/search Riftbound rules text (Comprehensive Rules / Tournament Rules)
      security: []
      description: Rules content is sourced from static local JSON files, not the database.
      parameters:
        - { name: document, in: query, schema: { type: string, enum: [TR, CR] } }
        - { name: lang, in: query, schema: { type: string, enum: [en, fr], default: en } }
        - { name: ruleId, in: query, schema: { type: string } }
        - { name: searchQuery, in: query, description: "If present, search mode takes priority over document/ruleId listing.", schema: { type: string } }
        - { name: limit, in: query, description: "Only used in search mode, defaults to 30.", schema: { type: integer } }
      responses:
        "200":
          description: Rule entries (shape depends on whether `searchQuery`/`ruleId` is used).
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RuleEntry" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /games/{gameId}/scanner/ai-match:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Games]
      summary: Identify a card from a photo using AI vision
      description: Requires permission `scanner:ai` (rate/cost-sensitive external AI call).
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, description: "Base64 data URL, e.g. data:image/jpeg;base64,...", maxLength: 8000000 }
      responses:
        "200":
          description: Best match, if any.
          content:
            application/json:
              schema:
                type: object
                properties:
                  match: { $ref: "#/components/schemas/ScannerMatch" }
                  identification: { $ref: "#/components/schemas/AiIdentification" }
        "400": { $ref: "#/components/responses/NestedValidationError" }
        "403": { description: Missing scanner:ai permission., content: { application/json: { schema: { $ref: "#/components/schemas/NestedError" } } } }
        "404": { $ref: "#/components/responses/NestedNotFound" }
        "502": { description: AI identification failed., content: { application/json: { schema: { $ref: "#/components/schemas/NestedError" } } } }

  /games/{gameId}/scanner/match:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Games]
      summary: Fuzzy-match card text (e.g. from on-device OCR) against the catalog
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 3, maxLength: 5000 }
                lang: { type: string }
      responses:
        "200":
          description: "Best match, if any (null if text shorter than 3 characters)."
          content:
            application/json:
              schema: { type: object, properties: { match: { $ref: "#/components/schemas/ScannerMatch" } } }
        "400": { $ref: "#/components/responses/NestedValidationError" }
        "404": { $ref: "#/components/responses/NestedNotFound" }

  /games/{gameId}/scanner/names:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Games]
      summary: List distinct card names for a set (used to seed local OCR matching)
      security: []
      parameters:
        - { name: setCode, in: query, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string } }
      responses:
        "200":
          description: Names.
          content:
            application/json:
              schema:
                type: object
                properties: { names: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } } }
        "400": { $ref: "#/components/responses/NestedValidationError" }
        "404": { $ref: "#/components/responses/NestedNotFound" }

  /games/{gameId}/products:
    get:
      tags: [Games]
      summary: Public product catalogue of a game
      description: >
        Browsable without an account, like the card gallery. Ownership is not
        included here — `/collection/games/{gameSlug}/products` serves the same
        catalogue annotated with what the caller owns. Returns 404 when the game
        has no product catalogue enabled.
      parameters:
        - { name: gameId, in: path, required: true, description: "Slug or ObjectId.", schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 48, maximum: 96 } }
        - { name: setCode, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [box, unit, starter, bundle, accessory, book, other] } }
        - { name: edition, in: query, description: "Game edition. Defaults to the game's current edition when it has one; `all` lifts the restriction. Products without an edition attribute match no edition.", schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: "Free text, plus the card-gallery token syntax carried over to products: `faction:Rebelles points<=8 commando`. Fields are the game's own facets, plus `set` and `kind`; a token wins over the matching parameter." }
        - { name: "min_{attribute}", in: query, description: "Lower bound of a numeric facet, e.g. `min_points=8`. Keys the game does not carry are ignored.", schema: { type: number } }
        - { name: "max_{attribute}", in: query, description: "Upper bound of a numeric facet, e.g. `max_points=12`.", schema: { type: number } }
        - { name: "in_{attribute}", in: query, description: "Comma-separated values of a value facet, e.g. `in_faction=Empire,Rebelles`. Values the facet does not declare are ignored.", schema: { type: string } }
        - { name: containers, in: query, description: "`true` for products with contents, `false` for leaves.", schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Product catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        kind: { type: string }
                        setCode: { type: string }
                        edition: { type: string, description: "Game edition the product belongs to, when the range has editions." }
                        image: { type: string }
                        contents: { type: array, items: { $ref: "#/components/schemas/ProductContent" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  setCodes: { type: array, items: { type: string } }
                  editions: { type: array, items: { type: string }, description: "Editions present in the catalogue, sorted by label in reverse alphabetical order. Empty when the game has none." }
                  facets: { type: array, items: { $ref: "#/components/schemas/ProductFilterFacet" }, description: "Filterable attributes carried by the game's products; what `min_*`, `max_*` and `in_*` accept." }
                  stats: { type: "null", description: "Always null here: without an account there is nothing to complete." }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /games/{gameId}/sets:
    parameters:
      - { name: gameId, in: path, required: true, description: "Declared but currently ignored - always returns Riftbound's sets.", schema: { type: string } }
    get:
      tags: [Games]
      summary: Get card sets
      security: []
      description: Currently hard-coded to serve the static Riftbound sets data file regardless of the path parameter.
      responses:
        "200": { description: Sets. }

  # ---------------------------------------------------------------- Lairs
  /lairs:
    get:
      tags: [Lairs]
      summary: Search lairs (game stores / venues)
      security: [{}, { sessionAuth: [] }, { apiKeyAuth: [] }]
      description: >
        Authentication is optional. Anonymously, only public lairs are returned.
        With a session or API key, the caller also sees the private lairs they
        **own** - following a private lair is not enough here, though it does
        open `GET /lairs/{lairId}`.


        `lat` and `lng` together search around a point, nearest first; `radius`
        bounds it. Both coordinates are required - one alone names no point.
      parameters:
        - { name: gameId, in: query, schema: { type: string } }
        - { name: search, in: query, description: "Case-insensitive substring of the lair name.", schema: { type: string } }
        - { name: lat, in: query, description: "Latitude of the search centre, -90 to 90. Requires `lng`; ignored on its own. Out of range answers 400.", schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, description: "Longitude of the search centre, -180 to 180. Requires `lat`; ignored on its own. Out of range answers 400.", schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius, in: query, description: "Search radius in kilometres around `lat`/`lng`. Must be greater than 0. Ignored without both coordinates.", schema: { type: number, default: 50, exclusiveMinimum: 0 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: Paginated lairs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lairs: { type: array, items: { $ref: "#/components/schemas/Lair" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /lairs/{lairId}:
    parameters:
      - { name: lairId, in: path, required: true, description: "Mongo ObjectId of the lair.", schema: { type: string } }
    get:
      tags: [Lairs]
      summary: Get one lair's showcase
      security: [{}, { sessionAuth: [] }, { apiKeyAuth: [] }]
      description: >
        Authentication is optional: it opens private lairs the caller follows,
        owns or administers, and fills in `isFollowing`.


        A private lair the caller may not read answers **404, never 403** - a
        403 would confirm it exists, which is exactly what its privacy promises
        to withhold. A malformed id answers 404 for the same reason.


        `isPro` is a boolean and nothing more: a Pro access granted by the team
        carries a free-text reason written by staff, which never leaves the
        admin screen.
      responses:
        "200":
          description: The lair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LairDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /lairs/{lairId}/follow:
    parameters:
      - { name: lairId, in: path, required: true, description: "Mongo ObjectId of the lair.", schema: { type: string } }
    put:
      tags: [Lairs]
      summary: Follow a lair
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      description: >
        Idempotent - following a lair already followed changes nothing and
        answers the same. Following a lair is what makes a private one readable,
        so a private lair one does not already follow (or own) answers 404 here
        too: an invitation is needed, not a request.
      responses:
        "200":
          description: The follow state after the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LairFollowState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Lairs]
      summary: Stop following a lair
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      description: >
        Idempotent, with one assumed exception: unfollowing a **private** lair
        closes its door, so a second `DELETE` answers 404. The state is still
        the one asked for.
      responses:
        "200":
          description: The follow state after the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LairFollowState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Leagues
  /leagues/{leagueId}/ranking:
    parameters:
      - { name: leagueId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Leagues]
      summary: Get a league's participant ranking
      description: >
        Public leagues are visible anonymously. Private leagues require the
        caller to be a participant or organizer (returns 403, even when not
        logged in). Note: league search/create/update/delete and match
        reporting are implemented as Next.js server actions
        (`app/leagues/actions.ts`), not as REST endpoints, and so are not part
        of this API surface.
      security: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 16, maximum: 100 } }
      responses:
        "200":
          description: Paginated ranking.
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants: { type: array, items: { $ref: "#/components/schemas/LeagueRankingParticipant" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- News
  /news:
    get:
      tags: [News]
      summary: List/search news
      security: []
      parameters:
        - { name: gameId, in: query, schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
        - { name: includeTags, in: query, description: "Set to `true` to include the distinct list of all tags.", schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Paginated news.
          content:
            application/json:
              schema:
                type: object
                properties:
                  news: { type: array, items: { $ref: "#/components/schemas/News" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  tags: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [News]
      summary: Create a news article
      description: Requires permission `news:update`.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, summary, content]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                summary: { type: string, minLength: 1, maxLength: 500 }
                content: { type: string, minLength: 1 }
                banner: { type: string, format: uri }
                source: { allOf: [{ $ref: "#/components/schemas/NewsSource" }], nullable: true }
                originalLang: { type: string, enum: [fr, en, it, de], default: fr, description: "The language the article is written in." }
                gameIds: { type: array, items: { type: string, pattern: "^[0-9a-fA-F]{24}$" }, default: [] }
                tags: { type: array, items: { type: string, minLength: 1, maxLength: 50 }, default: [] }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/News" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /news/{newsId}:
    parameters:
      - { name: newsId, in: path, required: true, schema: { type: string } }
    get:
      tags: [News]
      summary: Get a news article
      security: []
      responses:
        "200": { description: News., content: { application/json: { schema: { $ref: "#/components/schemas/News" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [News]
      summary: Update a news article
      description: Requires permission `news:update`.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                summary: { type: string, minLength: 1, maxLength: 500 }
                content: { type: string, minLength: 1 }
                banner: { type: string, format: uri }
                source: { allOf: [{ $ref: "#/components/schemas/NewsSource" }], nullable: true, description: "`null` removes the attribution." }
                originalLang: { type: string, enum: [fr, en, it, de] }
                gameIds: { type: array, items: { type: string, pattern: "^[0-9a-fA-F]{24}$" } }
                tags: { type: array, items: { type: string, minLength: 1, maxLength: 50 } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/News" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /news/{newsId}/like:
    parameters:
      - { name: newsId, in: path, required: true, schema: { type: string } }
    post:
      tags: [News]
      summary: Toggle like on a news article
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: New like state.
          content:
            application/json:
              schema: { type: object, properties: { liked: { type: boolean }, likesCount: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /news/{newsId}/translations/{lang}:
    parameters:
      - { name: newsId, in: path, required: true, schema: { type: string } }
      - { name: lang, in: path, required: true, schema: { type: string, enum: [fr, en, it, de] } }
    put:
      tags: [News]
      summary: Save a news article's translation in one language
      description: |
        Creates or replaces the translation. The three texts may be empty: a translation is written in
        several sittings, and an empty field displays the original rather than blocking the rest.
        Sending all three empty **removes** the translation — an empty translation appears nowhere,
        and its address would answer 404. Saving a translation does not change `contentUpdatedAt`.
        Requires permission `news:update`.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200, default: "" }
                summary: { type: string, maxLength: 500, default: "" }
                content: { type: string, default: "" }
      responses:
        "200":
          description: Saved, or removed when all three texts were empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  removed: { type: boolean, description: "True when the translation was removed because every text was empty." }
        "400": { description: "Unsupported language, or the article's own original language." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [News]
      summary: Remove a news article's translation in one language
      description: Requires permission `news:update`.
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Removed., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "400": { description: Unsupported language. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /news/import:
    post:
      tags: [News]
      summary: Build a news draft from an external article
      description: |
        Fetches the given article, converts its body to markdown keeping its layout and images,
        copies those images to Joutes' own storage, and brackets the card names of the given game
        so they render as card links. **Nothing is saved**: the response is a draft meant to fill
        the news form, which the author reviews before publishing. Requires permission `news:update`.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: "Public http(s) address of the article to import." }
                gameId: { type: string, pattern: "^[0-9a-fA-F]{24}$", description: "Card catalogue used to detect card names. Without it, no detection happens." }
      responses:
        "200":
          description: The draft. Not saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string }
                  summary: { type: string }
                  content: { type: string, description: "Markdown, with bracketed card mentions." }
                  banner: { type: string, format: uri }
                  source: { $ref: "#/components/schemas/NewsSource" }
                  lang: { type: string, enum: [fr, en, it, de], description: "The language the page declares, when Joutes speaks it." }
                  images:
                    type: object
                    properties:
                      rehosted: { type: integer, description: "Images copied to Joutes' storage." }
                      keptRemote: { type: integer, description: "Images left at their original address." }
                  bannerMissed: { type: boolean, description: "The source declared a banner that could not be copied." }
                  cardsDetected: { type: boolean }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: The page is too large to import. }
        "415": { description: The address does not serve a web page. }
        "422": { description: No article could be extracted from that page. }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { description: The source site did not answer, or refused to serve the page. }

  /news/upload:
    post:
      tags: [News]
      summary: Upload a news banner image
      description: Requires permission `news:update`. `multipart/form-data`, field `file` (JPG/PNG/WebP, max 5 MB).
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        "200": { description: Uploaded., content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  # -------------------------------------------------------------- Notifications
  /notifications:
    get:
      tags: [Notifications]
      summary: List the caller's notifications
      description: |
        Paginated inbox. A notification targets an audience (a user, a lair's owners or
        followers, an event's participants or creator); this endpoint resolves what the
        caller is entitled to see. `link` is the notification's destination as a Joutes
        relative path, or `null` when it leads nowhere.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: The caller's notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  total: { type: integer }
                  unreadCount: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Count the caller's unread notifications
      description: |
        Push payloads carry no badge count - computing it per recipient during fan-out
        would cost more than the delivery. Clients ask for it themselves instead.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: The count., content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every notification as read
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: Marked., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification as read
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { in: path, name: notificationId, required: true, schema: { type: string } }
      responses:
        "200": { description: Marked., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /notifications/{notificationId}/hide:
    post:
      tags: [Notifications]
      summary: Hide one notification from the caller's inbox
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { in: path, name: notificationId, required: true, schema: { type: string } }
      responses:
        "200": { description: Hidden., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /notifications/devices:
    get:
      tags: [Notifications]
      summary: List the caller's registered push devices
      description: The full push token is never returned - only its last 8 characters.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: Registered devices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices: { type: array, items: { $ref: "#/components/schemas/PushDevice" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Notifications]
      summary: Register a device for push delivery
      description: |
        Upserts on the push token, and detaches the same `installationId` from any other
        account first. Registering also turns the account's push preference on: accepting
        the operating system's prompt is the opt-in, and the account switch exists to turn
        delivery back off.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPushDevice" }
      responses:
        "201": { description: Registered., content: { application/json: { schema: { type: object, properties: { device: { $ref: "#/components/schemas/PushDevice" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /notifications/devices/{deviceId}:
    delete:
      tags: [Notifications]
      summary: Revoke a registered device
      description: |
        Also the sign-out call from the mobile app, which must issue it *before* closing
        its session - afterwards the request carries no cookie, answers 401, and the phone
        keeps receiving the notifications of the account it just left.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { in: path, name: deviceId, required: true, schema: { type: string } }
      responses:
        "200": { description: Revoked., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Play Groups
  /play-groups:
    get:
      tags: [Play Groups]
      summary: List the caller's play groups
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Groups., content: { application/json: { schema: { type: object, properties: { groups: { type: array, items: { $ref: "#/components/schemas/PlayGroup" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Play Groups]
      summary: Create a play group (caller becomes owner)
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, description: { type: string } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { group: { $ref: "#/components/schemas/PlayGroup" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /play-groups/{playGroupId}:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: Get a play group
      description: >
        Authentication is optional. A member gets the whole group, hydrated
        member list included. Anyone else gets a **lighter form** - name,
        description, visibility, customisation, member and follower counts -
        and never the member list: who plays with whom is not public, and a
        private group does not hand its roster to whoever guesses its id.


        The full showcase, with its public announcements and its contents,
        is `GET /play-groups/{playGroupId}/showcase`.
      security: [{}, { sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: Group., content: { application/json: { schema: { type: object, properties: { group: { $ref: "#/components/schemas/PlayGroup" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Play Groups]
      summary: Set which games are enabled for this group's shared collection (owner/admin only)
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabledGameIds]
              properties:
                enabledGameIds: { type: array, items: { type: string }, maxItems: 500, nullable: true, description: "null re-enables every game." }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { group: { $ref: "#/components/schemas/PlayGroup" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /play-groups/{playGroupId}/members:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: List a play group's members
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { type: object, properties: { id: { type: string }, name: { type: string }, description: { type: string } } }
                  currentUserRole: { type: string, enum: [owner, admin, member] }
                  members: { type: array, items: { $ref: "#/components/schemas/PlayGroupMember" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Play Groups]
      summary: Invite a user to a play group (owner/admin only)
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIdentifier]
              properties: { userIdentifier: { type: string, description: "Email, displayName#discriminator tag, or user id." } }
      responses:
        "201": { description: Invitation created., content: { application/json: { schema: { type: object, properties: { invitation: { $ref: "#/components/schemas/PlayGroupInvitation" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already a member, or an invitation is already pending.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /play-groups/{playGroupId}/members/{memberId}:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: memberId, in: path, required: true, description: "Target member's user id.", schema: { type: string } }
    patch:
      tags: [Play Groups]
      summary: Change a member's role (owner only)
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { type: string, enum: [admin, member] } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Play Groups]
      summary: Remove a member (owner/admin only; admins cannot remove owners or other admins)
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Removed., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /play-groups/{playGroupId}/showcase:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: Get a play group's public showcase
      description: >
        No session needed, and **served for a private group too**: its showcase
        stays open to whoever has the address - that is what lets you invite
        someone to look at it - and only its place on the roll is withdrawn.
        `indexable` is then false: a private group turning up in a search
        would not be private.


        Nothing private goes through: no polls, no sessions, no named activity.
        **Announcements only appear when their scope is `public`.** Member
        publications appear only where the member made them public.


        A stream declared more than 24 hours ago is dropped: nothing removes
        one automatically, and a forgotten stream would hold the showcase
        forever.
      security: [{}, { sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: The showcase.
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: "#/components/schemas/PlayGroup" }
                  indexable: { type: boolean, description: "False for a private group - ask search engines not to index it." }
                  followerCount: { type: integer }
                  isFollowing: { type: boolean, description: "False without a session." }
                  isMember: { type: boolean }
                  games: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, icon: { type: string } } } }
                  announcements: { type: array, items: { $ref: "#/components/schemas/PlayGroupAnnouncement" }, description: "Public scope only." }
                  contents: { type: array, items: { $ref: "#/components/schemas/PlayGroupContent" } }
                  memberContents: { type: array, items: { $ref: "#/components/schemas/UserContent" }, description: "Members' own public publications." }
                  lives: { type: array, items: { $ref: "#/components/schemas/PlayGroupLive" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/follow:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Play Groups]
      summary: Follow a play group's showcase
      description: >
        Idempotent, like following an account or a venue. A private group can
        be followed too - its showcase is open to whoever has the address, and
        following grants no access to the inside of the group.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: The state reached., content: { application/json: { schema: { $ref: "#/components/schemas/PlayGroupFollowState" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Play Groups]
      summary: Stop following a play group's showcase
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: The state reached., content: { application/json: { schema: { $ref: "#/components/schemas/PlayGroupFollowState" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/sessions:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: List a group's sessions (members only)
      description: >
        Polls first, then confirmed sessions by date. Members only - a session
        says who comes to play, where and when; that is the inside of the
        group, not its showcase.


        Cancelled sessions only come back when asked for: they stay readable to
        explain a hole in the agenda without cluttering the current list.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { name: status, in: query, description: "Repeatable. Defaults to `poll` and `confirmed`.", schema: { type: array, items: { type: string, enum: [poll, confirmed, cancelled] } } }
      responses:
        "200": { description: Sessions., content: { application/json: { schema: { type: object, properties: { sessions: { type: array, items: { $ref: "#/components/schemas/PlayGroupSession" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Play Groups]
      summary: Propose a session or a poll (members only)
      description: >
        One operation for both because it is one object: `startsAt` makes a
        confirmed session, `slots` makes a poll. Open to every member -
        proposing an evening is not an act of governance; settling the poll is.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayGroupSessionInput" }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { session: { $ref: "#/components/schemas/PlayGroupSession" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/sessions/{sessionId}:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: Get one session (members only)
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: Session., content: { application/json: { schema: { type: object, properties: { session: { $ref: "#/components/schemas/PlayGroupSession" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Play Groups]
      summary: Edit a session (author or manager)
      description: >
        Slots are not editable here - a poll is settled through `/confirm`, and
        rewriting its slots would erase the votes already cast.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayGroupSessionInput" }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { session: { $ref: "#/components/schemas/PlayGroupSession" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Play Groups]
      summary: Cancel a session (author or manager)
      description: >
        Cancels rather than erases: "cancelled" reads, "gone" leaves people
        searching. `purge=1` erases for good and is reserved to managers - for
        a session created by mistake, which never happened at all.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { name: purge, in: query, description: "`1` erases instead of cancelling. Managers only.", schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: Cancelled, or deleted., content: { application/json: { schema: { type: object, properties: { session: { $ref: "#/components/schemas/PlayGroupSession" }, deleted: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/sessions/{sessionId}/vote:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Play Groups]
      summary: Toggle availability on a poll slot (members only)
      description: >
        **A deliberate toggle**, unlike following. Saying you are available is
        not a commitment a double request would leave in a misleading state: a
        slot ticked twice comes back unticked, which the poll shows at once and
        nothing is lost. Splitting it in two verbs would force the client to
        know where it stands before speaking.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [slotId], additionalProperties: false, properties: { slotId: { type: string } } }
      responses:
        "200": { description: The poll after the vote., content: { application/json: { schema: { type: object, properties: { session: { $ref: "#/components/schemas/PlayGroupSession" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/sessions/{sessionId}/confirm:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Play Groups]
      summary: Settle a poll on one slot (owner/admin only)
      description: >
        The slot becomes the session's date. Whoever said they were available
        on it is carried over as attending: having said you are free on
        Thursday *is* an answer for Thursday.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [slotId], additionalProperties: false, properties: { slotId: { type: string } } }
      responses:
        "200": { description: The confirmed session., content: { application/json: { schema: { type: object, properties: { session: { $ref: "#/components/schemas/PlayGroupSession" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/sessions/{sessionId}/rsvp:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Play Groups]
      summary: Answer a session (members only)
      description: >
        The answer replaces the previous one, and **giving the same answer
        again cancels it**. Retracting is the same gesture as answering, on the
        same button, with no fourth "I withdraw" state to explain.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [answer], properties: { answer: { type: string, enum: [yes, maybe, no] } } }
      responses:
        "200": { description: The session after the answer., content: { application/json: { schema: { type: object, properties: { session: { $ref: "#/components/schemas/PlayGroupSession" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/announcements:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: List a group's announcements (members only)
      description: >
        Newest first, **all scopes**: this is the group's own board. The ones
        scoped `public` reappear on the showcase.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: Announcements., content: { application/json: { schema: { type: object, properties: { announcements: { type: array, items: { $ref: "#/components/schemas/PlayGroupAnnouncement" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Play Groups]
      summary: Publish an announcement (owner/admin only)
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayGroupAnnouncementInput" }
      responses:
        "201": { description: Published., content: { application/json: { schema: { type: object, properties: { announcement: { $ref: "#/components/schemas/PlayGroupAnnouncement" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/announcements/{announcementId}:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: announcementId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Play Groups]
      summary: Rewrite an announcement (owner/admin only)
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayGroupAnnouncementInput" }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { announcement: { $ref: "#/components/schemas/PlayGroupAnnouncement" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Play Groups]
      summary: Delete an announcement (owner/admin only)
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/contents:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Play Groups]
      summary: Publish a group content (members only)
      description: >
        **Open to every member**, unlike announcements: writing up a tournament
        or dropping your video is not an act of governance. Editing and
        deleting stay with the author and the managers.


        Contents are read back through the showcase, which is public - that is
        where they are meant to be read.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayGroupContentInput" }
      responses:
        "201": { description: Published., content: { application/json: { schema: { type: object, properties: { content: { $ref: "#/components/schemas/PlayGroupContent" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/contents/{contentId}:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: contentId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Play Groups]
      summary: Edit a group content (author or manager)
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayGroupContentInput" }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { content: { $ref: "#/components/schemas/PlayGroupContent" } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Play Groups]
      summary: Delete a group content (author or manager)
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/collection:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: Get a play group's shared collection overview
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: includeEmpty, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200": { description: Overview., content: { application/json: { schema: { $ref: "#/components/schemas/CollectionOverview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/collection/value:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Play Groups]
      summary: Recompute the estimated value of a play group's shared collection
      security: [{ sessionAuth: [] }]
      description: >
        Open to any member: the collection is shared, so is its value. Games
        disabled for the group are skipped — the screen does not show them.
      responses:
        "200":
          description: Values per game id, and their total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/CollectionValue" }
                  value:
                    allOf: [{ $ref: "#/components/schemas/CollectionValue" }]
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/collection/games/{gameSlug}/value:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: gameSlug, in: path, required: true, schema: { type: string } }
    post:
      tags: [Play Groups]
      summary: Recompute the estimated value of a play group's collection for one game
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: The game's freshly computed value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: { $ref: "#/components/schemas/CollectionValue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/collection/cards:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Play Groups]
      summary: Add a card to a play group's shared collection
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCardInput" }
      responses:
        "200": { description: Added., content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The card's game is not enabled for this group.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /play-groups/{playGroupId}/collection/cards/{cardId}:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: cardId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: Get every copy of a card in a play group's shared collection
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Owned copies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quantity: { type: integer }
                  cards: { type: array, items: { $ref: "#/components/schemas/CollectionCardEntry" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Play Groups]
      summary: Mark/unmark a shared collection entry as borrowed (any member)
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryId, borrowedBy]
              properties: { entryId: { type: string }, borrowedBy: { type: string, nullable: true } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { id: { type: string }, borrowedBy: { type: string } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Play Groups]
      summary: Remove a card from a play group's shared collection
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: entryId, in: query, schema: { type: string } }
      responses:
        "200": { description: Removed., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /play-groups/{playGroupId}/collection/games/{gameSlug}:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: gameSlug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: Get a play group's collection completion for a specific game
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 48, maximum: 96 } }
        - { name: setCode, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: owned, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Game collection page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  setCodes: { type: array, items: { type: string } }
                  types: { type: array, items: { type: string } }
                  stats: { $ref: "#/components/schemas/GameCollectionStats" }
                  game: { type: object, properties: { id: { type: string }, name: { type: string }, slug: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Group or game not found, or game disabled for this group.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/collection/games/{gameSlug}/variants:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
      - { name: gameSlug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: List all owned printings/variants of a card by name in a play group's collection
      security: [{ sessionAuth: [] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Variants (raw array).
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /play-groups/{playGroupId}/sell-list:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: Get a play group's sell list (auto-created for a member landing on an empty group)
      security: [{}, { sessionAuth: [] }]
      responses:
        "200": { description: Sell list., content: { application/json: { schema: { type: object, properties: { sellList: { allOf: [{ $ref: "#/components/schemas/SellList" }], nullable: true }, canEdit: { type: boolean } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/{playGroupId}/sell-list/items:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Play Groups]
      summary: List a shared collection card for sale on behalf of the play group
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellListItemInput" }
      responses:
        "201": { description: Listed., content: { application/json: { schema: { $ref: "#/components/schemas/SellListItem" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Card already for sale., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /play-groups/{playGroupId}/wishlists:
    parameters:
      - { name: playGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Play Groups]
      summary: List a play group's wishlists
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Wishlists., content: { application/json: { schema: { type: object, properties: { wishlists: { type: array, items: { $ref: "#/components/schemas/Wishlist" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Play Groups]
      summary: Create a wishlist for a play group
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 2000 }
                visibility: { type: string, enum: [private, unlisted, public], default: private }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Wishlist" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A wishlist with this name already exists for this group., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /play-groups/explore:
    get:
      tags: [Play Groups]
      summary: The roll - discover open play groups
      description: >
        Authentication is optional: it adds **the private groups the caller is
        a member of**, and fills in `isFollowing` on each row. Other people's
        private groups are excluded by the query itself, before any join - a
        group you must not see must not leave the database.


        Three orders. `vifs` ranks by sign of life - a stream comes before
        everything, then a recent publication or an upcoming session, whose
        weight decays with time rather than flipping at a threshold. `neufs` by
        creation date. `proches` needs a point (`lat`/`lng`) and can only order
        the groups whose default place is a Joutes venue, the only one carrying
        geocoded coordinates; the others go to the end rather than to zero
        kilometres, which would be a lie. **Without a point, `proches` falls
        back to `vifs`** - the applied order comes back in `order`.


        `q` searches the name, tagline, rhythm, place and games, accent- and
        case-insensitively.
      security: [{}, { sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { name: q, in: query, description: "Free text.", schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [vifs, proches, neufs], default: vifs } }
        - { name: lat, in: query, description: "Latitude for `proches`. Out-of-range values are ignored, falling back to `vifs`.", schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, description: "Longitude for `proches`. Requires `lat`.", schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: count, in: query, description: "Rows wanted.", schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: The roll.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/ExploreGroup" } }
                  total: { type: integer, description: "Groups matching `q`, whatever `count`." }
                  hasMore: { type: boolean }
                  count: { type: integer }
                  order: { type: string, enum: [vifs, proches, neufs], description: "The order actually applied." }
                  lives: { type: array, items: { $ref: "#/components/schemas/PlayGroupLive" }, description: "Ongoing streams across all groups, most watched first." }
                  posts: { type: array, items: { $ref: "#/components/schemas/PlayGroupContent" }, description: "At most 3 recent publications across all groups." }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/invitations:
    get:
      tags: [Play Groups]
      summary: List the caller's pending play group invitations
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Invitations., content: { application/json: { schema: { type: object, properties: { invitations: { type: array, items: { $ref: "#/components/schemas/PlayGroupInvitation" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /play-groups/invitations/{invitationId}:
    parameters:
      - { name: invitationId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Play Groups]
      summary: Accept a play group invitation
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Joined., content: { application/json: { schema: { type: object, properties: { group: { $ref: "#/components/schemas/PlayGroup" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Quizzes
  /quizzes:
    get:
      tags: [Quizzes]
      summary: List/search quizzes
      security: []
      parameters:
        - { name: gameId, in: query, schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: Paginated quizzes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quizzes: { type: array, items: { $ref: "#/components/schemas/Quiz" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Quizzes]
      summary: Create a quiz
      description: >
        Open to any signed-in user — quizzes are community content. The caller becomes the
        quiz's author and is the only one who can edit, translate or delete it afterwards,
        short of the `quizzes:update-all` moderation permission.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizInput" }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Quiz" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /quizzes/cover:
    post:
      tags: [Quizzes]
      summary: Upload a cover image for a quiz
      description: >
        Open to any signed-in user, like writing a quiz itself: the cover is chosen in the form,
        before the quiz exists, so the right is checked on the session rather than on a quiz.
        `multipart/form-data`, field `file` (JPG/PNG/WebP/GIF, max 5 MB). The route only stores
        the file and returns its address: it is a `POST /quizzes` or a `PATCH /quizzes/{quizId}`
        with `coverImageUrl` that puts it on the quiz.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        "200": { description: Uploaded., content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /quizzes/import:
    post:
      tags: [Quizzes]
      summary: Draft a quiz from free text
      description: >
        Turns a raw text (rules thread, question of the day, FAQ) into a quiz draft using an LLM.
        Nothing is persisted: the caller reviews the draft and posts it to `/quizzes`.
        With `gameId`, card names found in the text are wrapped in brackets so they link to the
        card once the quiz is published. Writing a quiz is open to everyone, but having a model
        write it is not: this requires `quizzes:ai-import`, which gates the billed model call the
        way `scanner:ai` gates card recognition.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 20000, description: "Source text to analyse." }
                gameId:
                  type: string
                  pattern: "^[0-9a-fA-F]{24}$"
                  description: "Game whose cards are detected in the text. Omit for no card detection."
      responses:
        "200":
          description: Quiz draft, not persisted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string }
                  blocks: { type: array, items: { $ref: "#/components/schemas/QuizBlock" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: No question could be drawn from the text. }
        "502": { description: The language model call failed. }

  /quizzes/{quizId}/translations/{lang}:
    parameters:
      - { name: quizId, in: path, required: true, schema: { type: string } }
      - { name: lang, in: path, required: true, schema: { type: string, enum: [en, fr, it, de] } }
    put:
      tags: [Quizzes]
      summary: Save a quiz translation
      description: >
        Replaces the quiz's translation for that language. Translating a quiz changes what
        readers see, so it follows the same rule as editing: the quiz's author, or holders of
        `quizzes:update-all`.
        The quiz's own `updatedAt` is left untouched, so it keeps marking the last *content* change —
        that is what flags translations as stale. Translating a quiz into its own language is rejected.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                entries:
                  type: object
                  description: "Keyed by block, question or option id."
                  additionalProperties: { $ref: "#/components/schemas/QuizTranslationEntry" }
      responses:
        "200": { description: Saved. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Quizzes]
      summary: Remove a quiz translation
      description: Reserved to the quiz's author, or to holders of `quizzes:update-all`.
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Removed. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /quizzes/{quizId}/scores:
    parameters:
      - { name: quizId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Quizzes]
      summary: Record the caller's score for one section of a quiz
      description: |
        A quiz can hold several sections, each ended by its own validation button; a score is recorded per section, keyed by the id of the block carrying that button. The latest score replaces the previous one for that section — replaying a section is relearning, and showing a score the last attempt contradicts would mislead.

        The caller sends its **answers**, not a score. Clients grade locally to answer without waiting for the network, but a score they declared would be worth nothing: the server grades the same answers again and returns what it counted.

        Answering a quiz stays open to everyone; only recording needs an account, for want of a profile to file the score under.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockId]
              properties:
                blockId: { type: string, description: Id of the form block whose validation button was pressed. }
                answers:
                  type: object
                  description: "Answer per question id: an option id, a list of option ids, or free input. The number field carries its raw text, hence a string where a number is expected."
                  additionalProperties:
                    oneOf:
                      - { type: string }
                      - { type: array, items: { type: string } }
                      - { type: number }
      responses:
        "200":
          description: Score as the server counted it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  correct: { type: integer, example: 3 }
                  total: { type: integer, example: 5 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such quiz, or no such section in it.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500": { $ref: "#/components/responses/ServerError" }

  /quizzes/{quizId}:
    parameters:
      - { name: quizId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Quizzes]
      summary: Get a quiz
      description: |
        Quiz prose is annotated markdown — `[Card Name]` mentions, keyword brackets and `:icon:` tags. `cardIdByName` and `cardsById` resolve those mentions against the quiz's game, so a client can render card links without looking the cards up itself. Translations are covered too: a reader switches language without asking again.
      security: []
      responses:
        "200":
          description: Quiz, with the cards its prose mentions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Quiz"
                  - type: object
                    properties:
                      cardIdByName:
                        type: object
                        description: Lower-cased card name → card id, for every `[Card Name]` mention the quiz resolves.
                        additionalProperties: { type: string }
                      cardsById:
                        type: object
                        description: Card id → card, for the same mentions.
                        additionalProperties: { $ref: "#/components/schemas/CardNameMatch" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Quizzes]
      summary: Update a quiz
      description: >
        Reserved to the quiz's author, or to holders of `quizzes:update-all`.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/QuizInput"
              minProperties: 1
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Quiz" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Quizzes]
      summary: Delete a quiz
      description: >
        Reserved to the quiz's author, or to holders of `quizzes:update-all`. Reports filed
        against the quiz are removed along with it.
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Sell Lists
  /sell-lists/{sellListId}:
    parameters:
      - { name: sellListId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" } }
    get:
      tags: [Sell Lists]
      summary: Get a sell list
      security: []
      description: Sell lists are always publicly viewable; session is only used to compute `canEdit`.
      responses:
        "200":
          description: Sell list.
          content:
            application/json:
              schema:
                type: object
                properties: { sellList: { $ref: "#/components/schemas/SellList" }, canEdit: { type: boolean } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Sell Lists]
      summary: Update a sell list's description (owner or play-group member)
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, minProperties: 1, properties: { description: { type: string, maxLength: 2000 } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/SellList" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Sell Lists]
      summary: Delete a sell list and all its items
      security: [{ sessionAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sell-lists/{sellListId}/items:
    parameters:
      - { name: sellListId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Sell Lists]
      summary: List/search a sell list's items
      security: []
      parameters:
        - { name: gameId, in: query, schema: { type: string } }
        - { name: setCode, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: condition, in: query, schema: { type: string } }
        - { name: foil, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: language, in: query, schema: { type: string } }
        - { name: priceMin, in: query, schema: { type: number } }
        - { name: priceMax, in: query, schema: { type: number } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 48, maximum: 96 } }
      responses:
        "200":
          description: Paginated items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SellListItem" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  games: { type: array, items: { type: object, properties: { gameId: { type: string }, gameName: { type: string }, gameSlug: { type: string } } } }
                  setCodes: { type: array, items: { type: string } }
                  types: { type: array, items: { type: string } }
                  conditions: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Sell Lists]
      summary: List a card for sale
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellListItemInput" }
      responses:
        "201": { description: Listed., content: { application/json: { schema: { $ref: "#/components/schemas/SellListItem" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Card already for sale., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /sell-lists/{sellListId}/items/{itemId}:
    parameters:
      - { name: sellListId, in: path, required: true, schema: { type: string } }
      - { name: itemId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Sell Lists]
      summary: Update a sell list item's price/currency/note
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                price: { type: number, minimum: 0, maximum: 1000000, nullable: true }
                currency: { type: string, enum: [EUR, USD, GBP, JPY, CNY] }
                note: { type: string, maxLength: 300 }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/SellListItem" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Sell Lists]
      summary: Remove a sell list item
      security: [{ sessionAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sell-lists/mine:
    get:
      tags: [Sell Lists]
      summary: Get the caller's own sell list (null if they haven't listed anything yet)
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Sell list., content: { application/json: { schema: { type: object, properties: { sellList: { allOf: [{ $ref: "#/components/schemas/SellList" }], nullable: true } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /sell-lists/mine/items:
    post:
      tags: [Sell Lists]
      summary: List one of the caller's own collection cards for sale
      description: Transparently creates the caller's personal sell list on first use.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellListItemInput" }
      responses:
        "201": { description: Listed., content: { application/json: { schema: { $ref: "#/components/schemas/SellListItem" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Card already for sale., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------------------------------------------------------------- Trades
  /trades/cards/resolve:
    post:
      tags: [Trades]
      summary: Match a written card list to real printings
      description: >
        Turns the lines of a list written by hand ("2 Card name (SET) 123") into
        the printings a trade offer can hold. Matching happens here because it
        needs the caller's collection or the card catalog, which a client has
        neither of; nothing is written to the trade at this stage.


        Matching goes from the most precise designation to the widest: set code
        and collector number, then set code alone, then the name alone. Names
        are compared without case or diacritics - a list copied by hand does not
        always carry them.


        Session cookie only: like every `/trades` route, this one does not
        accept an API key.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, cards]
              properties:
                scope:
                  type: string
                  enum: [collection, catalog]
                  description: >
                    Where to look: the caller's own collection (their side of
                    the trade) or the whole catalog (what they ask for).
                cards:
                  type: array
                  maxItems: 50
                  description: "Designations, in the order of the list. At most one side's worth of cards."
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, minLength: 1, maxLength: 200 }
                      setCode: { type: string, maxLength: 100 }
                      collectorNumber: { type: string, maxLength: 100 }
      responses:
        "200":
          description: >
            Matches, in the same order and of the same length as `cards`: entry
            `i` answers designation `i`, and is `null` when no card satisfies
            it. The caller reports those rather than dropping them silently - a
            list pasted crooked must not replace an offer halfway without
            saying so.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/TradeCard"
                        - type: "null"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Upload
  /upload:
    post:
      tags: [Upload]
      summary: Generic admin file upload
      description: Admin-only (caller's email must be in the hardcoded admin allowlist).
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary, description: "JPEG/PNG/WebP/GIF, max 5 MB." } }
      responses:
        "200":
          description: Uploaded.
          content:
            application/json:
              schema:
                type: object
                properties: { url: { type: string }, pathname: { type: string }, contentType: { type: string } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Users
  /users/me/permissions:
    get:
      tags: [Users]
      summary: List the caller's own effective permissions
      description: >
        What the signed-in account is allowed to do, so clients only offer the
        actions that will succeed. `policies:vote` and `erratas:vote` are implicit
        for every signed-in account and always listed. An administrator holds every
        permission — the list is not exhaustive for them, `isAdmin` is.

        Two separate namespaces answer the same question. `permissions` are staff
        capabilities granted by hand (moderating erratas, importing a quiz).
        `entitlements` are opened by a paid subscription and recomputed from the
        billing provider; every one of them is prefixed `sub:`, so the two lists
        can never collide. `plans` names the subscriptions currently held, and is
        empty for a free account.
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Effective permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions: { type: array, items: { type: string }, example: ["erratas:vote", "policies:vote"] }
                  isAdmin: { type: boolean }
                  plans: { type: array, items: { type: string, enum: [expert, pro] }, example: ["pro"] }
                  entitlements: { type: array, items: { type: string }, example: ["sub:lair-pro", "sub:profile-badge"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /users/me/games:
    get:
      tags: [Users]
      summary: List the caller's own followed games
      description: |
        The caller's `User.games` (followed games), regardless of `isPublicProfile` — unlike `GET /users/{userTagOrId}`, which only reveals this list when the profile is public.

        `gameIds` holds the raw stored ids; `games` adds what it takes to display them (name and slug) without a second call. A followed game that has since been deleted appears in `gameIds` but not in `games`.
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Followed games, in the order the user followed them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameIds: { type: array, items: { type: string } }
                  games:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        slug: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /users:
    get:
      tags: [Users]
      summary: The community registry
      description: >
        The accounts that opened their showcase. The parameters are **exactly**
        those the web page reads, so a link pasted into a conversation and a call
        from an application open the same page of results.


        **`count` is a running total, not a page number.** It climbs twenty at a
        time up to a hundred, and every call returns the list from the start -
        that is what "load more" does on the web, and the registry's pagination
        has never been anything else. A `page` or `offset` would misdescribe it.


        A session is optional: it only fills in `isFollowing` on each row.


        Two filters are expensive and know it: `live` reads the linked channels,
        `sells` reads one sell list per candidate (up to a hundred). They are
        resolved in that order so the second works on an already-narrowed list.
      security: [{}, { sessionAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - { name: q, in: query, description: "Free text on name/username/display name, or an exact `Pseudo#1234` tag.", schema: { type: string } }
        - { name: game, in: query, description: "Game id followed by the account.", schema: { type: string } }
        - { name: city, in: query, description: "Only matches accounts that opted into showing their city.", schema: { type: string } }
        - { name: sells, in: query, description: "`1` to keep only accounts with cards for sale.", schema: { type: string, enum: ["1"] } }
        - { name: live, in: query, description: "`1` to keep only accounts streaming right now on their profile.", schema: { type: string, enum: ["1"] } }
        - { name: sort, in: query, schema: { type: string, enum: [active, followers, name], default: active } }
        - { name: count, in: query, description: "Running total of rows wanted. Rounded up to a multiple of 20, capped at 100.", schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: The rows, and whether more can be asked for.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/RegistryEntry" } }
                  total: { type: integer, description: "Accounts matching the filters, regardless of `count`." }
                  hasMore: { type: boolean, description: "False at the cap, even when `total` is larger - there is nothing more to load." }
                  count: { type: integer, description: "The running total actually applied, after rounding and capping." }
        "500": { $ref: "#/components/responses/ServerError" }

  /users/leaderboard:
    get:
      tags: [Users]
      summary: The achievements leaderboard, and the caller's rank
      description: >
        **One ranking, one filter.** Private profiles are left out - appearing
        there would mean showing up in a registry one chose to leave - and the
        rank returned is the index in *that* ranking. Computing them separately
        would announce a rank matching no visible place.


        Only the top three are hydrated: it is a podium, not a directory. `rank`
        is null without a session, and for an account that does not appear.
      security: [{}, { sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: The podium and the caller's standing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/LeaderboardRow" } }
                  rank:
                    type: object
                    nullable: true
                    properties:
                      rank: { type: integer }
                      points: { type: integer }
                      unlocked: { type: integer }
                      total: { type: integer, description: "Size of the eligible ranking." }
        "500": { $ref: "#/components/responses/ServerError" }

  /users/{userTagOrId}:
    parameters:
      - { name: userTagOrId, in: path, required: true, description: "Mongo ObjectId, `{displayName}#{discriminator}` (the `#` percent-encoded), or `{displayName}{discriminator}` concatenated — in that last form the discriminator is the final 4 digits.", schema: { type: string } }
    get:
      tags: [Users]
      summary: Get a user's public profile
      description: >
        The privacy gate is not an access gate: a private profile still resolves
        and still answers, because a profile no one can reach is a profile no one
        can report. Always returned - identity, avatar, banner, description,
        links, showcase layout, badges, follower count and "member since".
        Gated behind `isPublicProfile` - `games`, `lairs`, `achievements` and
        `live` (empty or null otherwise).


        `isFollowing` only means something for an identified caller; without a
        session or API key it is `false` and nothing is read to say so.
      security: [{}, { sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: Public profile., content: { application/json: { schema: { $ref: "#/components/schemas/PublicUserProfile" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /users/{userTagOrId}/follow:
    parameters:
      - { name: userTagOrId, in: path, required: true, description: "Mongo ObjectId, `{displayName}#{discriminator}` (the `#` percent-encoded), or `{displayName}{discriminator}` concatenated — in that last form the discriminator is the final 4 digits.", schema: { type: string } }
    put:
      tags: [Users]
      summary: Follow this account
      description: >
        Two idempotent verbs rather than one toggle. A `POST` that flips the
        state is an invitation to the double tap: two requests from one clumsy
        touch would leave the follow in the opposite state to the one intended.
        `PUT` means "let me follow", `DELETE` means "let me stop", and repeating
        either changes nothing.


        Following is one-way, which is what separates it from friendship - that
        one is asked for, accepted, and opens the collection and the games.
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: The state reached., content: { application/json: { schema: { type: object, properties: { following: { type: boolean }, followersCount: { type: integer } } } } } }
        "400": { description: "Following yourself.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Users]
      summary: Stop following this account
      security: [{ sessionAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: The state reached., content: { application/json: { schema: { type: object, properties: { following: { type: boolean }, followersCount: { type: integer } } } } } }
        "400": { description: "Unfollowing yourself.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userTagOrId}/achievements:
    parameters:
      - { name: userTagOrId, in: path, required: true, description: "Mongo ObjectId, `{displayName}#{discriminator}` (the `#` percent-encoded), or `{displayName}{discriminator}` concatenated — in that last form the discriminator is the final 4 digits.", schema: { type: string } }
    get:
      tags: [Users]
      summary: A player's achievements, earned and still to earn
      description: >
        A route of its own rather than one more field on the profile: the whole
        catalog can run to hundreds of entries, and opening a profile header
        should not pay for it. The profile therefore carries only the unlocked
        ones.


        A private profile returns nothing - the same rule `GET /users/{userTagOrId}`
        already applies to its achievements.
      security: []
      responses:
        "200":
          description: The catalog, annotated with what this player unlocked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  achievements: { type: array, items: { $ref: "#/components/schemas/AchievementWithUnlockInfo" } }
                  unlocked: { type: integer }
                  total: { type: integer }
                  points: { type: integer, description: "Points of the unlocked ones. A status achievement is worth zero." }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /users/{userTagOrId}/contents:
    parameters:
      - { name: userTagOrId, in: path, required: true, description: "Mongo ObjectId, `{displayName}#{discriminator}` (the `#` percent-encoded), or `{displayName}{discriminator}` concatenated — in that last form the discriminator is the final 4 digits.", schema: { type: string } }
    get:
      tags: [Users]
      summary: What a player publishes
      description: "Articles, videos and replays. Drafts are excluded in the query, not at render time. A private profile returns nothing."
      security: []
      responses:
        "200":
          description: Published contents, most recent first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents: { type: array, items: { $ref: "#/components/schemas/UserContent" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /users/{userTagOrId}/wishlists:
    parameters:
      - { name: userTagOrId, in: path, required: true, description: "Mongo ObjectId, `{displayName}#{discriminator}` (the `#` percent-encoded), or `{displayName}{discriminator}` concatenated — in that last form the discriminator is the final 4 digits.", schema: { type: string } }
    get:
      tags: [Users]
      summary: List a user's public wishlists
      security: []
      responses:
        "200": { description: Public wishlists., content: { application/json: { schema: { type: object, properties: { wishlists: { type: array, items: { $ref: "#/components/schemas/Wishlist" } } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /users/{userTagOrId}/sell-list:
    parameters:
      - { name: userTagOrId, in: path, required: true, description: "Mongo ObjectId, `{displayName}#{discriminator}` (the `#` percent-encoded), or `{displayName}{discriminator}` concatenated — in that last form the discriminator is the final 4 digits.", schema: { type: string } }
    get:
      tags: [Users]
      summary: Get a user's sell list (sell lists are always public)
      security: []
      responses:
        "200": { description: Sell list., content: { application/json: { schema: { type: object, properties: { sellList: { allOf: [{ $ref: "#/components/schemas/SellList" }], nullable: true } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Wishlists
  /wishlists:
    get:
      tags: [Wishlists]
      summary: List the caller's own personal wishlists
      security: [{ sessionAuth: [] }]
      responses:
        "200": { description: Wishlists., content: { application/json: { schema: { type: object, properties: { wishlists: { type: array, items: { $ref: "#/components/schemas/Wishlist" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Wishlists]
      summary: Create a personal wishlist
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 2000 }
                visibility: { type: string, enum: [private, unlisted, public], default: private }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Wishlist" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: A wishlist with this name already exists., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /wishlists/mine:
    get:
      tags: [Wishlists]
      summary: Get every wishlist the caller can add a card to (personal + each play group)
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Personal and group wishlists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  personal: { type: array, items: { $ref: "#/components/schemas/Wishlist" } }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        group: { type: object, properties: { id: { type: string }, name: { type: string } } }
                        wishlists: { type: array, items: { $ref: "#/components/schemas/Wishlist" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /wishlists/{wishlistId}:
    parameters:
      - { name: wishlistId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" } }
    get:
      tags: [Wishlists]
      summary: Get a wishlist
      security: []
      description: Session optional; used to compute `canEdit` and view access for non-public wishlists.
      responses:
        "200":
          description: Wishlist.
          content:
            application/json:
              schema:
                type: object
                properties: { wishlist: { $ref: "#/components/schemas/Wishlist" }, canEdit: { type: boolean } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Wishlists]
      summary: Update a wishlist
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 2000 }
                visibility: { type: string, enum: [private, unlisted, public] }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Wishlist" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A wishlist with this name already exists for this owner., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Wishlists]
      summary: Delete a wishlist and all its items
      security: [{ sessionAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /wishlists/{wishlistId}/items:
    parameters:
      - { name: wishlistId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Wishlists]
      summary: List/search a wishlist's items
      security: []
      description: Session optional; when present, each item is annotated with `ownedQuantity` reflecting how many the current viewer personally owns.
      parameters:
        - { name: gameId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 48, maximum: 96 } }
        - { name: minOwned, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Paginated items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WishlistItem" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  games: { type: array, items: { type: object, properties: { gameId: { type: string }, gameName: { type: string }, gameSlug: { type: string } } } }
                  types: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Wishlists]
      summary: Add a card to a wishlist
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId, gameSlug, name, setCode, collectorNumber, image]
              properties:
                cardId: { type: string, minLength: 1, maxLength: 100 }
                gameSlug: { type: string, minLength: 1, maxLength: 100 }
                name: { type: string, minLength: 1, maxLength: 200 }
                setCode: { type: string, minLength: 1, maxLength: 100 }
                collectorNumber: { type: string, minLength: 1, maxLength: 100 }
                image: { type: string }
                type: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 99, default: 1 }
                note: { type: string, maxLength: 300 }
      responses:
        "201": { description: Added., content: { application/json: { schema: { $ref: "#/components/schemas/WishlistItem" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /wishlists/{wishlistId}/items/{itemId}:
    parameters:
      - { name: wishlistId, in: path, required: true, schema: { type: string } }
      - { name: itemId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Wishlists]
      summary: Update a wishlist item's quantity/note
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99 }
                note: { type: string, maxLength: 300 }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/WishlistItem" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Wishlists]
      summary: Remove a wishlist item
      security: [{ sessionAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Cron
  /cron/refresh-events:
    get:
      tags: [Cron]
      summary: Refresh events for every lair from their event source URLs
      description: "Only public lairs with at least one source are visited, a few at a time. Each source is read on its own; a source that fails leaves the events it produced last time untouched. Harvested events already in the database are updated in place so favourites and registrations survive; an event gone from its source is removed, or marked `cancelled` when someone follows it. See `docs/EVENT_SOURCES.md`."
      security: [{ cronSecret: [] }]
      responses:
        "200":
          description: Refresh summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  summary: { type: object, properties: { total: { type: integer }, successes: { type: integer }, failures: { type: integer }, failingSources: { type: integer, description: "Sources that failed inside lairs that otherwise succeeded." } } }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        lairId: { type: string }
                        lairName: { type: string }
                        success: { type: boolean }
                        message: { type: string }
                        sources: { type: array, items: { type: object, properties: { url: { type: string }, ok: { type: boolean }, error: { type: string }, warnings: { type: array, items: { type: string } }, count: { type: integer } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /cron/update-discord-boards:
    get:
      tags: [Cron]
      summary: Refresh every configured Discord event-board message
      security: [{ cronSecret: [] }]
      responses:
        "200": { description: Done., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /cron/update-event-boards:
    get:
      tags: [Cron]
      summary: Process one pending Discord event-board update from the queue
      description: "Processes at most one event per invocation (`boardsNeedsUpdate: true`); intended to be called repeatedly by the scheduler."
      security: [{ cronSecret: [] }]
      responses:
        "200": { description: Done., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >
        Session cookie set by Better Auth after signing in via `/auth/*`.
        Some operations additionally require a specific permission
        (e.g. `news:update`, `quizzes:update-all`, `policies:update`,
        `scanner:ai`, `quizzes:ai-import`) or admin status on top of a valid
        session - see the operation description. Permissions gating a billed
        external AI call (`scanner:ai`, `quizzes:ai-import`) are always granted
        separately and never implied by the matching content permission.
        `quizzes:update-all` also honours the legacy `quizzes:update` name.
    apiKeyAuth:
      type: http
      scheme: bearer
      description: >
        Personal API key (`jts_...`), sent as `Authorization: Bearer jts_...`.
        Every operation resolved through `authenticateApiRequest` accepts it in
        place of the session cookie — that is most of the user-scoped API, even
        where only `sessionAuth` is listed below: the schemes were added later
        than those operations were written, and only the ones documented since
        carry both.
    cronSecret:
      type: http
      scheme: bearer
      description: "Shared secret for scheduled jobs. Send as `Authorization: Bearer <CRON_SECRET>`."

  responses:
    Unauthorized:
      description: Not authenticated.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated but not authorized (missing permission/role, or not a member).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationError:
      description: Invalid request body or query parameters.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServerError:
      description: Unexpected server error.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NestedValidationError:
      description: Invalid request body.
      content: { application/json: { schema: { $ref: "#/components/schemas/NestedError" } } }
    NestedNotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/NestedError" } } }

  schemas:
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [user, lair, event], description: "Who the notification targets, not what it is about." }
        title: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        link: { type: string, nullable: true, description: "Joutes relative path, or null when the notification leads nowhere." }
        read: { type: boolean }
        template: { type: string, nullable: true, description: "Drives a richer in-app rendering (league match confirmations)." }
        leagueId: { type: string, nullable: true }
        matchId: { type: string, nullable: true }
        lair: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        event: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }

    PushDevice:
      type: object
      properties:
        id: { type: string }
        platform: { type: string, enum: [ios, android] }
        tokenPreview: { type: string, description: "Last 8 characters of the push token. The token itself is a sending secret and never leaves the server." }
        installationId: { type: string, description: "Echoed back so a client can recognise its own device." }
        appVersion: { type: string, nullable: true }
        state: { type: string, enum: [active, revoked] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    RegisterPushDevice:
      type: object
      required: [platform, token, installationId]
      properties:
        platform: { type: string, enum: [ios, android] }
        token: { type: string, description: "APNs device token (hexadecimal) on iOS, FCM registration token on Android." }
        installationId: { type: string, description: "Stable per-installation identifier generated by the app; survives token rotation." }
        environment: { type: string, enum: [production, sandbox], description: "iOS only. A development build's token is only valid against the APNs sandbox." }
        locale: { type: string, enum: [fr, en, de, it] }
        appVersion: { type: string }

    Error:
      type: object
      properties:
        error: { type: string }
        details: { description: "Present on some 400 responses (raw or flattened Zod error)." }

    NestedError:
      type: object
      description: Used by a handful of endpoints (games loop/deck-checker/scanner) instead of the flat Error shape.
      properties:
        error:
          type: object
          properties: { message: { type: string } }

    PublicUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        discriminator: { type: string }
        avatar: { type: string }

    UserShowcaseSection:
      type: object
      description: >
        One block of a profile's showcase, in the order it is shown. The stored
        order is a list of keys: an account that never reordered anything has
        nothing stored and follows the platform's default, so a block added
        later appears where it was meant to, for everyone, without a migration.
      required: [key, enabled]
      properties:
        key: { type: string, enum: [live, about, decks, publications, achievements, follows, trade] }
        enabled: { type: boolean }
        locked: { type: boolean, description: "The account cannot switch this block off - wishes and sales decide their visibility list by list." }

    UserLink:
      type: object
      description: "An outgoing link of a profile, recognised by its host. Anything that is not http(s) is dropped, not rendered."
      required: [url, kind, host]
      properties:
        url: { type: string }
        kind: { type: string, enum: [twitch, youtube, discord, bluesky, instagram, tiktok, x, mastodon, website] }
        host: { type: string }
        label: { type: string }

    UserBadges:
      type: object
      description: >
        Derived, never stored and never settable: the subscription tier, and the
        achievements marked as statuses (3 at most, oldest first). A status opens
        no right - that is what separates it from a tier.
      properties:
        plan: { type: string, nullable: true }
        statuses:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              icon: { type: string }

    StreamLinkLive:
      type: object
      description: "A stream running right now, as announced on this profile. The link's target list *is* the setting: a channel that only announces on a venue does not show up here."
      required: [url, startedAt]
      properties:
        url: { type: string }
        title: { type: string }
        startedAt: { type: string, format: date-time }

    AchievementWithUnlockInfo:
      type: object
      description: "A catalog achievement, plus when this player unlocked it. No `unlockedAt` means still to be earned."
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        points: { type: number }
        unlockedAt: { type: string, format: date-time }

    UserContent:
      type: object
      description: "Something a player published. Drafts (`visibility: private`) never leave the author's own account."
      required: [id, authorId, kind, title, publishedAt]
      properties:
        id: { type: string }
        authorId: { type: string }
        kind: { type: string, enum: [video, article, replay] }
        title: { type: string }
        summary: { type: string }
        body: { type: string, description: "Markdown. Articles only." }
        url: { type: string, description: "Videos and replays only." }
        thumbnail: { type: string }
        duration: { type: string, description: "Shown as written - the platform does not parse it." }
        gameId: { type: string }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegistryUser:
      type: object
      description: "A public account as the registry lists it. `city` only appears for accounts that opted in (`showcase.showCity`)."
      required: [id, username, games, isPublicProfile]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        discriminator: { type: string }
        avatar: { type: string }
        description: { type: string }
        city: { type: string }
        games: { type: array, items: { type: string } }
        isPublicProfile: { type: boolean }
        createdAt: { type: string, format: date-time }

    RegistryEntry:
      type: object
      description: "A registry row: the account, plus what does not live in its own record."
      required: [user, badges, followers, isFollowing, isLive, games]
      properties:
        user: { $ref: "#/components/schemas/RegistryUser" }
        badges: { $ref: "#/components/schemas/UserBadges" }
        followers: { type: integer }
        isFollowing: { type: boolean, description: "Always false without a session." }
        isLive: { type: boolean }
        games: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/GameSummary" } }

    LeaderboardRow:
      type: object
      required: [userId, points, unlocked]
      properties:
        userId: { type: string }
        points: { type: integer }
        unlocked: { type: integer }
        user: { $ref: "#/components/schemas/RegistryUser" }
        badges: { $ref: "#/components/schemas/UserBadges" }

    PublicUserProfile:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        discriminator: { type: string }
        avatar: { type: string }
        banner: { type: string, description: "Showcase banner. Requires the `sub:profile-banner` entitlement to set, never to read." }
        createdAt: { type: string, format: date-time, description: "The \"member since\"." }
        description: { type: string, nullable: true }
        website: { type: string, nullable: true }
        socialLinks: { type: array, items: { type: string } }
        isPublicProfile: { type: boolean }
        showcase:
          type: object
          description: "How the account arranged its showcase. Always served - a private profile still has a name, links and badges."
          properties:
            sections: { type: array, items: { $ref: "#/components/schemas/UserShowcaseSection" } }
            links: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/UserLink" } }
            pinnedDeckId: { type: string }
            playStyles: { type: array, items: { type: string } }
        badges: { $ref: "#/components/schemas/UserBadges" }
        followersCount: { type: integer }
        isFollowing: { type: boolean, description: "Whether the caller follows this account. Always false without a session or API key." }
        live: { allOf: [{ $ref: "#/components/schemas/StreamLinkLive" }], nullable: true, description: "Public profiles only." }
        games: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, slug: { type: string }, icon: { type: string } } } }
        lairs: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, address: { type: string } } } }
        achievements: { type: array, description: "Unlocked ones only. The full catalog is at `/users/{userTagOrId}/achievements`.", items: { $ref: "#/components/schemas/AchievementWithUnlockInfo" } }

    GameSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        icon: { type: string }
        banner: { type: string }
        type: { type: string, description: "GameTypeKey" }

    Game:
      allOf:
        - $ref: "#/components/schemas/GameSummary"
        - type: object
          properties:
            featuredLairs: { type: array, items: { type: string } }
            images:
              type: object
              properties: { icon: { type: string }, horizontal: { type: string }, vertical: { type: string }, banner: { type: string } }
            longDescription: { type: string }
            color: { type: string }
            note: { type: object, additionalProperties: { type: number } }
            gallery: { type: array, items: { type: string } }
            links:
              type: object
              additionalProperties: { type: string }
              properties: { website: { type: string }, x: { type: string }, discord: { type: string }, youtube: { type: string }, twitch: { type: string }, bluesky: { type: string } }
            metadata:
              type: object
              properties:
                publisher: { type: string }
                releaseDate: { type: string }
                players: { type: object, properties: { min: { type: integer }, max: { type: integer } } }
                playingTimeMinutes: { type: object, properties: { min: { type: integer }, max: { type: integer } } }
            formats: { type: array, items: { type: object, properties: { name: { type: string } } } }
            stats: { type: object, properties: { communityRating: { type: number }, popularityScore: { type: number } } }
            features:
              type: object
              description: >
                Fanions activés pour ce jeu. Seuls les fanions actifs sont
                écrits : un fanion absent vaut « désactivé ».
              properties:
                cards: { type: boolean }
                collection: { type: boolean }
                products:
                  type: boolean
                  description: >
                    Catalogue de boîtes et de figurines, et la collection qui va
                    avec — les jeux sans cartes. Commande `/games/{gameId}/products`
                    et `/collection/games/{gameSlug}/products`, qui répondent 404
                    quand il est éteint.
                rules: { type: boolean }
                policies: { type: boolean }
                tournaments: { type: boolean }
                deckChecker: { type: boolean }
                cubes: { type: boolean }
                battleReports:
                  type: boolean
                  description: "Les parties de ce jeu se saisissent en rapport de bataille."

    BoosterCard:
      type: object
      properties:
        id: { type: string }
        cardId: { type: string }
        lang: { type: string }
        boosterId: { type: string }
        name: { type: string }
        subtitle: { type: string }
        setCode: { type: string }
        collectorNumber: { type: string }
        foil: { type: boolean, description: "Card printed only in foil, or foil copy in a collection." }
        printings: { type: array, items: { $ref: "#/components/schemas/CardPrinting" } }
        printingId: { type: string, description: "Print variant of this copy; absent means the card's base version." }
        printingName: { type: string }
        image: { type: string }
        orientation:
          type: string
          enum: [portrait, landscape]
          description: >
            Print orientation of the card. Almost every card reads vertically;
            some — Riftbound battlefields — are printed sideways and are shown
            rotated a quarter turn. Absent means `portrait`.
        price: { type: number }
        marketPrice: { $ref: "#/components/schemas/MarketPrice" }
        newInCollection: { type: boolean }
        banned: { type: boolean }
        text: { type: string }
        type: { type: string }

    CardFilterFacet:
      type: object
      description: "A game attribute the catalog can be filtered on: a range for numeric attributes, a value list otherwise."
      required: [key, type]
      properties:
        key: { type: string }
        type: { type: string, enum: [number, value] }
        min: { type: number, description: "Numeric facets only." }
        max: { type: number, description: "Numeric facets only." }
        values: { type: array, items: { type: string }, description: "Value facets only." }

    MarketPrice:
      type: object
      description: >
        Second-hand market price of a card, as read from a marketplace on
        `updatedAt`. It is a "from" price: the cheapest printing of the card,
        English edition only. Cards without a reading carry no `marketPrice`
        field at all — absent is not zero. A card read by several marketplaces
        carries a single price, from the one that identifies its printings most
        reliably; `source` says which, and `productId` only means anything for
        that marketplace.
      required: [amount, currency, source, updatedAt]
      properties:
        amount: { type: number }
        currency: { type: string, description: "ISO 4217 code (`EUR`)." }
        source:
          type: string
          enum: [cardnexus, cardmarket]
          description: "Marketplace the amount was read from."
        updatedAt: { type: string, format: date-time, description: "Date of the marketplace reading, not of the response." }
        productId: { type: integer, description: "Product the amount comes from, in `source`'s catalogue, to link back to it." }

    TradeCard:
      type: object
      description: >
        A printing a trade offer can hold. `key` identifies the printing across
        the whole exchange — it is what tells two versions of the same card in
        the same set apart, so two entries that differ only by their collector
        number do not collapse into one.
      required: [key, name, setCode, collectorNumber, image, owned]
      properties:
        key: { type: string, description: "Stable printing key: `name|setCode|collectorNumber`." }
        cardId: { type: string, description: "Catalog id. Absent on a few historic collection entries the catalog no longer knows; such a card cannot be asked for as a counterparty." }
        name: { type: string }
        setCode: { type: string }
        collectorNumber: { type: string }
        image: { type: string }
        type: { type: string }
        orientation: { type: string, enum: [portrait, landscape], description: "Absent means `portrait`; a landscape card is shown rotated a quarter turn." }
        gameId: { type: string }
        gameName: { type: string }
        gameSlug: { type: string }
        owned: { type: integer, description: "Copies of this printing the caller owns. Caps what they may offer." }
        marketPrice: { $ref: "#/components/schemas/MarketPrice" }

    CardPrinting:
      type: object
      description: "Print variant of a card (normal, foil, promo pack, pre-release, judge...). Without `image`, the card's own artwork is used."
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        foil: { type: boolean }
        image: { type: string }

    CardNameMatch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        setCode: { type: string }
        collectorNumber: { type: string }
        type: { type: string }
        text: { type: string }

    ScannerMatch:
      type: object
      nullable: true
      properties:
        id: { type: string }
        name: { type: string }
        score: { type: number }

    AiIdentification:
      type: object
      properties:
        cardName: { type: string, nullable: true }
        game: { type: string, nullable: true }
        collectorNumber: { type: string, nullable: true }
        setCode: { type: string, nullable: true }
        lang: { type: string, nullable: true }

    Errata:
      type: object
      properties:
        id: { type: string }
        cardIds: { type: array, items: { type: string } }
        cards: { type: array, items: { $ref: "#/components/schemas/BoosterCard" } }
        type: { type: string, enum: [errata, clarification, ruling] }
        details: { type: string }
        originalLang: { type: string }
        contentUpdatedAt: { type: string, format: date-time }
        translations:
          type: array
          items: { type: object, properties: { lang: { type: string }, details: { type: string }, updatedAt: { type: string, format: date-time } } }
        source: { type: string }
        errataDate: { type: string, format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        deprecatedAt: { type: string, format: date-time }
        votes:
          type: object
          properties: { positive: { type: integer }, negative: { type: integer }, userVote: { type: string, enum: [positive, negative] } }

    Policy:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        originalLang: { type: string }
        contentUpdatedAt: { type: string, format: date-time }
        translations:
          type: array
          items: { type: object, properties: { lang: { type: string }, title: { type: string }, content: { type: string }, updatedAt: { type: string, format: date-time } } }
        gameId: { type: string }
        game: { type: object, properties: { id: { type: string }, slug: { type: string }, name: { type: string } } }
        source: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        deprecatedAt: { type: string, format: date-time }
        votes:
          type: object
          properties: { positive: { type: integer }, negative: { type: integer }, userVote: { type: string, enum: [positive, negative] } }

    RuleEntry:
      type: object
      description: >
        A rules-document entry (title/keyword/paragraph). `markup` uses a small
        custom pseudo-markup format (`{{rule id="..."}}`, `{{keyword id="..."}}`,
        `{{match}}...{{/match}}`), intended for client-side parsing, not HTML.
      properties:
        id: { type: string }
        content: { type: string }
        markup: { type: string }
        isTitle: { type: boolean }
        isKeyword: { type: boolean }
        depth: { type: integer }
        document: { type: string, enum: [TR, CR] }
        sectionId: { type: string }
        matched: { type: boolean, description: "Only present when searchQuery is used." }

    RiftboundDeckList:
      type: object
      properties:
        champions: { type: array, items: { $ref: "#/components/schemas/RiftboundDeckListCard" } }
        legends: { type: array, items: { $ref: "#/components/schemas/RiftboundDeckListCard" } }
        maindeck: { type: array, items: { $ref: "#/components/schemas/RiftboundDeckListCard" } }
        sideboard: { type: array, items: { $ref: "#/components/schemas/RiftboundDeckListCard" } }
        battlefields: { type: array, items: { $ref: "#/components/schemas/RiftboundDeckListCard" } }
        runes: { type: array, items: { $ref: "#/components/schemas/RiftboundDeckListCard" } }

    RiftboundDeckListCard:
      type: object
      properties:
        name: { type: string }
        quantity: { type: integer }
        cardId: { type: string }
        image: { type: string }
        orientation: { type: string, enum: [portrait, landscape], description: "Absent means `portrait`; a landscape card is shown rotated a quarter turn." }
        banned: { type: boolean }
        recognized: { type: boolean }
        erratas: { type: array, items: { $ref: "#/components/schemas/Errata" } }

    News:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        content: { type: string }
        banner: { type: string }
        source: { $ref: "#/components/schemas/NewsSource" }
        originalLang: { type: string, enum: [fr, en, it, de], description: "The language the article was written in." }
        contentUpdatedAt: { type: string, format: date-time, description: "Last change to the original texts. A translation older than this may be out of date." }
        translations: { type: array, items: { $ref: "#/components/schemas/NewsTranslation" } }
        gameIds: { type: array, items: { type: string } }
        games: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, icon: { type: string }, slug: { type: string } } } }
        tags: { type: array, items: { type: string } }
        authorId: { type: string }
        author: { type: object, properties: { id: { type: string }, displayName: { type: string }, discriminator: { type: string } } }
        likedBy: { type: array, items: { type: string } }
        likesCount: { type: integer }
        userHasLiked: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NewsSource:
      type: object
      description: Attribution of a news article reproduced from an external site.
      required: [name, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: "The site the article was originally published on." }
        url: { type: string, format: uri, description: "Link to the original article." }

    NewsTranslation:
      type: object
      description: |
        One language of a news article. Empty fields fall back to the original, field by field:
        a translation in progress shows what is translated and leaves the rest in the original language.
      required: [lang]
      properties:
        lang: { type: string, enum: [fr, en, it, de] }
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        content: { type: string }
        updatedAt: { type: string, format: date-time }

    QuizQuestion:
      type: object
      required: [id, type, prompt]
      properties:
        id: { type: string, minLength: 1 }
        type: { type: string, enum: [single, multiple, text, number] }
        prompt: { type: string, minLength: 1, maxLength: 1000 }
        options:
          type: array
          maxItems: 20
          items: { type: object, properties: { id: { type: string }, text: { type: string, maxLength: 300 } } }
        correctOptionIds: { type: array, items: { type: string }, description: "Required for single/multiple; at most 1 for single; must reference existing option ids; no duplicates." }
        correctText: { type: string, maxLength: 300, description: "Required (non-empty) for type=text." }
        correctNumber: { type: number, description: "Required for type=number." }
        correctFeedback: { type: string, maxLength: 2000 }
        incorrectFeedback: { type: string, maxLength: 2000 }

    QuizBlock:
      oneOf:
        - type: object
          required: [id, type, content]
          properties: { id: { type: string }, type: { type: string, enum: [markdown] }, content: { type: string, minLength: 1 } }
        - type: object
          required: [id, type, questions, showSubmitButton]
          properties:
            id: { type: string }
            type: { type: string, enum: [form] }
            questions: { type: array, minItems: 1, items: { $ref: "#/components/schemas/QuizQuestion" } }
            showSubmitButton: { type: boolean }

    QuizInput:
      type: object
      required: [title, blocks]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        gameId: { type: string, description: "24-char hex ObjectId, or \"\" to leave unlinked." }
        originalLang: { type: string, enum: [en, fr, it, de], default: fr, description: "Language the quiz is written in. Defaults to the application's default locale." }
        coverCardId:
          type: string
          maxLength: 200
          description: >
            A card of the quiz's game chosen to illustrate it, or "" to remove it. The card must
            belong to the linked game's catalog: an id it does not know illustrates nothing, and
            is dropped rather than kept as a dead reference. On a `PATCH`, an absent field leaves
            the cover as it is.
        coverImageUrl:
          type: string
          format: uri
          maxLength: 2000
          description: >
            A cover image uploaded by the author, or "" to remove it. It wins over `coverCardId`.
            Only addresses on the application's own storage are accepted, which is what
            `POST /quizzes/cover` returns.
        blocks: { type: array, minItems: 1, items: { $ref: "#/components/schemas/QuizBlock" } }

    Quiz:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        gameId: { type: string }
        game: { type: object, properties: { id: { type: string }, name: { type: string }, slug: { type: string }, icon: { type: string } } }
        coverCardId: { type: string, description: "A card of the game the author chose to illustrate the quiz." }
        coverImageUrl: { type: string, format: uri, description: "A cover image uploaded by the author. Wins over `coverCardId`." }
        coverImage: { type: string, format: uri, description: "The address the cover actually shows. Derived, rewritten on every save, so listings show a thumbnail per quiz without resolving the card catalog." }
        blocks: { type: array, items: { $ref: "#/components/schemas/QuizBlock" } }
        originalLang: { type: string, enum: [en, fr, it, de], description: "Language the quiz was written in (its \"VO\")." }
        translations: { type: array, items: { $ref: "#/components/schemas/QuizTranslation" } }
        authorId: { type: string }
        author: { type: object, properties: { id: { type: string }, displayName: { type: string }, discriminator: { type: string } } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    QuizTranslation:
      type: object
      description: >
        A quiz translated into one language. Texts are keyed by the id of the block, question or option
        they translate — never by position — so reordering the quiz never moves a translation, and
        removing a block simply leaves an orphan entry that is ignored. Any missing text falls back to
        the original, field by field.
      properties:
        lang: { type: string, enum: [en, fr, it, de] }
        title: { type: string }
        entries:
          type: object
          additionalProperties: { $ref: "#/components/schemas/QuizTranslationEntry" }
        updatedAt: { type: string, format: date-time }

    QuizTranslationEntry:
      type: object
      description: "Translated texts of one node. Fields present depend on the node: `content` for a markdown block, `text` for an option, the rest for a question."
      properties:
        content: { type: string }
        prompt: { type: string }
        text: { type: string }
        correctText: { type: string }
        correctFeedback: { type: string }
        incorrectFeedback: { type: string }

    DeckCardEntry:
      type: object
      description: "A card in a deck zone. The name is not copied along: it comes from the catalog, the only up-to-date source for a card."
      required: [cardId, quantity]
      properties:
        cardId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99, description: "A saner-than-any-game bound. What makes a deck legal are the game's zones, not this cap." }

    DeckCards:
      type: object
      description: >
        Deck contents, zone by zone; a missing zone is an empty zone. Which
        zones a deck actually shows is declared by its **game**, not by the
        deck: Riftbound splits legend/champions/runes/battlefields, most other
        games settle for a main deck, a sideboard and an extra zone. Cards left
        in a zone the game does not expose are kept, but not shown.
      properties:
        legend: { type: array, items: { $ref: "#/components/schemas/DeckCardEntry" } }
        champions: { type: array, items: { $ref: "#/components/schemas/DeckCardEntry" } }
        maindeck: { type: array, items: { $ref: "#/components/schemas/DeckCardEntry" } }
        runes: { type: array, items: { $ref: "#/components/schemas/DeckCardEntry" } }
        battlefields: { type: array, items: { $ref: "#/components/schemas/DeckCardEntry" } }
        sideboard: { type: array, items: { $ref: "#/components/schemas/DeckCardEntry" } }
        extra: { type: array, items: { $ref: "#/components/schemas/DeckCardEntry" } }

    DeckGuideSection:
      type: object
      description: "A titled passage of the deck's play guide - kept apart so one can be edited in place."
      required: [title, body]
      properties:
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 4000 }

    DeckMatchup:
      type: object
      required: [name, rating]
      properties:
        name: { type: string, maxLength: 120 }
        rating: { type: string, enum: [favorable, even, unfavorable] }

    DeckCardInfo:
      type: object
      description: "What a deck needs to know of a card to show and count it - a subset of the catalog document."
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        type: { type: string }
        setCode: { type: string }
        collectorNumber: { type: string }
        cost: { type: number, description: "Play cost. Cards without one (legends, runes) carry no value, and sit out of the cost curve." }
        domain: { type: array, items: { type: string } }
        orientation: { type: string, enum: [portrait, landscape] }

    DeckLegendFacet:
      type: object
      description: "A legend actually played by published decks, with how many play it. Drives the library's legend filter."
      required: [cardId, name, count]
      properties:
        cardId: { type: string }
        name: { type: string }
        count: { type: integer }

    Deck:
      type: object
      description: >
        A deck list tied to a game. Nothing computed is stored: size, legality,
        cost curve and collection coverage all derive from `cards` and from the
        game's zones, so two screens never disagree about the same deck.
      properties:
        id: { type: string }
        playerId: { type: string }
        gameId: { type: string }
        name: { type: string }
        url: { type: string }
        description: { type: string }
        decklist: { type: string, description: "Free-text list, as it existed before the editor. Still carries decks of games without a card catalog, and is rewritten on every save." }
        cards: { $ref: "#/components/schemas/DeckCards" }
        guide: { type: array, items: { $ref: "#/components/schemas/DeckGuideSection" } }
        matchups: { type: array, items: { $ref: "#/components/schemas/DeckMatchup" } }
        notes: { type: string, description: "The author's private memo. **Never served to anyone else** - the field is stripped from the response for any other caller." }
        format: { type: string, description: "Targeted play format (\"Standard OGN\"), as the game's own record declares it." }
        legendCardId: { type: string, description: "The card that gives the deck its identity (the legend, in Riftbound)." }
        legendName: { type: string, description: "That card's name as of the last save, so it shows without a second read of the catalog." }
        coverCardId: { type: string, description: "A card of the deck the author chose to illustrate it. Distinct from the legend, which is only the fallback." }
        coverImageUrl: { type: string, format: uri, description: "A cover image uploaded by the author. Wins over `coverCardId`." }
        coverImage: { type: string, format: uri, description: "The address the cover actually shows. Derived, rewritten on every save of the contents or of the cover, so listings show a thumbnail per deck without resolving the card catalog." }
        domains:
          type: array
          items: { type: string }
          description: "Domains covered by the deck's cards. Derived, recomputed on every save of the contents, so the library filters on it without joining the catalog."
        visibility:
          type: string
          enum: [private, unlisted, public]
          description: "`unlisted` is the middle ground: reachable by link, absent from the library and from search engines."
        creatorName: { type: string }
        favoritedBy: { type: array, items: { type: string } }
        favoritesCount: { type: integer, description: "Denormalised, to sort the library without reading the whole table." }
        views: { type: integer, description: "Reads of the deck page by someone other than its author." }
        version: { type: integer, readOnly: true, description: "Bumped on every save. Send it back as `expectedVersion` on PATCH to guard against a concurrent save." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Event:
      type: object
      properties:
        id: { type: string }
        lairId: { type: string }
        name: { type: string }
        description: { type: string }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        gameName: { type: string }
        game: { type: object, properties: { name: { type: string }, icon: { type: string }, banner: { type: string }, type: { type: string }, slug: { type: string } } }
        url: { type: string }
        price: { type: number }
        status: { type: string, enum: [available, sold-out, cancelled] }
        addedBy: { type: string }
        source:
          type: object
          description: "Where an automatically harvested event comes from: the configured source URL on the lair, and the event's id in that source when the JSON mapping gives one. Absent on hand-made events."
          properties:
            url: { type: string }
            externalId: { type: string }
        creatorId: { type: string }
        creator: { type: object, properties: { id: { type: string }, displayName: { type: string }, discriminator: { type: string } } }
        staff: { type: array, items: { type: object, properties: { userId: { type: string }, role: { type: string, enum: [organizer, judge] } } } }
        runningState: { type: string, enum: [not-started, ongoing, completed] }
        allowJoin: { type: boolean }
        preRegistration: { type: boolean }
        participants: { type: array, items: { type: string } }
        participantRegistrations:
          type: object
          additionalProperties: { type: string, enum: [NOT_REGISTERED, PRE_REGISTERED, REGISTERED, EXCLUDED] }
        registeredParticipantsCount: { type: integer }
        maxParticipants: { type: integer }
        favoritedBy: { type: array, items: { type: string } }
        lair: { type: object, properties: { id: { type: string }, name: { type: string }, address: { type: string }, owners: { type: array, items: { type: string } } } }
        discordBoards: { type: array, items: { type: object, properties: { channelId: { type: string }, messageId: { type: string } } } }
        boardsNeedsUpdate: { type: boolean }

    FriendRequest:
      type: object
      properties:
        id: { type: string }
        requesterId: { type: string }
        recipientId: { type: string }
        status: { type: string, enum: [pending, accepted, declined] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Lair:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        banner: { type: string }
        games: { type: array, items: { type: string } }
        owners: { type: array, items: { type: string } }
        address: { type: string }
        website: { type: string }
        isPrivate: { type: boolean }
        invitationCode: { type: string }
        location:
          type: object
          properties: { type: { type: string, enum: [Point] }, coordinates: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
        options: { $ref: "#/components/schemas/LairOptions" }

    LairOptions:
      type: object
      description: >
        Everything a venue configures about itself. All optional: a lair that
        set nothing falls back to the bare page - banner, practical details,
        games and agenda - with no empty tab and no half-filled card.
      properties:
        calendar: { type: object, properties: { mode: { type: string, enum: [CALENDAR, AGENDA, CONFERENCE] } } }
        theme: { $ref: "#/components/schemas/LairTheme" }
        sections:
          type: array
          description: >
            Order and on/off state of the showcase sections. A partial list is
            valid: a key missing from storage comes back enabled, in its default
            position, rather than silently disappearing. `calendar` is always on.
          items: { $ref: "#/components/schemas/LairSection" }
        live: { $ref: "#/components/schemas/LairLiveStream" }
        news: { type: array, items: { $ref: "#/components/schemas/LairNewsItem" } }
        featuredEventId: { type: string, description: "Event pinned in the \"featured\" block." }
        links: { type: array, items: { $ref: "#/components/schemas/LairLink" } }
        contact:
          type: object
          properties: { phone: { type: string }, email: { type: string } }
        openingHours: { type: array, items: { $ref: "#/components/schemas/LairOpeningHours" } }
        about: { $ref: "#/components/schemas/LairAbout" }

    LairTheme:
      type: object
      description: The venue's white-label settings.
      properties:
        logo: { type: string }
        accentColor: { type: string, description: "Hex colour, one of a closed five-value palette checked against the dark theme." }
        tintSurfaces: { type: boolean, description: "Tint cards and buttons, beyond headings alone." }

    LairSection:
      type: object
      properties:
        key: { type: string, enum: [news, featured, calendar, media, about] }
        enabled: { type: boolean }

    LairLiveStream:
      type: object
      description: The venue's ongoing stream, shown at the top of the news tab.
      properties:
        url: { type: string, description: "Twitch or YouTube." }
        title: { type: string }
        startedAt: { type: string, format: date-time }
        viewers: { type: integer }

    LairNewsItem:
      type: object
      description: An announcement published by the venue.
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string, description: "Shown on the card; the full body is in `content`." }
        content: { type: string, description: "Markdown." }
        category: { type: string, description: "Free-text venue category - \"Promotion\", \"New arrival\"..." }
        banner: { type: string }
        publishedAt: { type: string, format: date-time }
        pinned: { type: boolean, description: "A single pinned announcement leads; the rest follow by date." }
        link: { type: string }
        linkLabel: { type: string }

    LairLink:
      type: object
      properties:
        type: { type: string, enum: [website, instagram, facebook, discord, twitch, youtube, x, other] }
        url: { type: string }
        label: { type: string }

    LairOpeningHours:
      type: object
      description: >
        One opening range, one day of the week. `day` is ISO-numbered (1 =
        Monday ... 7 = Sunday); the oldest records carry `0` for Sunday and
        clients should read it as `7`. A day may carry **several** ranges - that
        is how split hours are described, "Tuesday 10:00-12:00 then
        14:00-19:00". A day absent from the list, or without `open`, is closed.
      properties:
        day: { type: integer, minimum: 0, maximum: 7 }
        open: { type: string, example: "10:00" }
        close: { type: string, example: "19:00" }

    LairOrganizer:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        avatar: { type: string }

    LairAbout:
      type: object
      properties:
        description: { type: string, description: "Markdown." }
        category: { type: string, description: "Venue-type badge shown under the title." }
        amenities: { type: array, items: { type: string } }
        photos: { type: array, items: { type: string } }
        videoUrl: { type: string }
        transit: { type: string }
        parking: { type: string }
        organizers: { type: array, items: { $ref: "#/components/schemas/LairOrganizer" } }
        rhythm:
          type: array
          description: "The venue's usual rhythm: \"Friday night\" -> \"Riftbound\"."
          items: { type: object, properties: { label: { type: string }, value: { type: string } } }

    LairDetail:
      allOf:
        - $ref: "#/components/schemas/Lair"
        - type: object
          properties:
            isPro: { type: boolean, description: "Whether the lair has Joutes Pro. A boolean and nothing more - never the reason it was granted." }
            followersCount: { type: integer }
            isFollowing: { type: boolean, description: "False without a session." }

    LairFollowState:
      type: object
      properties:
        following: { type: boolean }
        followersCount: { type: integer }

    LeagueRankingParticipant:
      type: object
      properties:
        userId: { type: string }
        points: { type: integer }
        pointsHistory:
          type: array
          items:
            type: object
            properties: { date: { type: string, format: date-time }, points: { type: integer }, reason: { type: string }, eventId: { type: string }, featId: { type: string, description: "Feat that earned the points, when the entry comes from one." }, matchId: { type: string, description: "League match the entry comes from. The server never sets it together with `tournamentId`, though the schema does not enforce that." }, tournamentId: { type: string, description: "Linked tournament whose closure produced the entry. The server never sets it together with `matchId`, though the schema does not enforce that." } }
        feats:
          type: array
          items: { type: object, properties: { featId: { type: string }, earnedAt: { type: string, format: date-time }, eventId: { type: string }, matchId: { type: string, description: "League match the feat was awarded in. The server never sets it together with `tournamentId`, though the schema does not enforce that." }, tournamentId: { type: string, description: "Linked tournament the feat was awarded in. The server never sets it together with `matchId`, though the schema does not enforce that." } } }
        joinedAt: { type: string, format: date-time }
        targets: { type: array, items: { type: object } }
        eliminatedBy: { type: string }
        eliminatedAt: { type: string, format: date-time }
        isEliminated: { type: boolean }
        rank: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        ratio: { type: number }
        user: { type: object, properties: { id: { type: string }, discriminator: { type: string }, displayName: { type: string }, avatar: { type: string }, username: { type: string } } }

    PlayGroupMember:
      type: object
      properties:
        userId: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        joinedAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/PublicUser" }

    PlayGroup:
      type: object
      description: >
        A play group. `members` is only present for a member of the group -
        who plays with whom is not public. A non-member gets the lighter form
        instead: everything below except `members` and `ownerId`, plus
        `memberCount`, `followerCount` and `isMember: false`.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        ownerId: { type: string }
        visibility: { type: string, enum: [public, private], description: "A private group leaves the roll for everyone but its members. Its showcase stays open to whoever has the address." }
        enabledGameIds: { type: array, items: { type: string }, nullable: true }
        options: { $ref: "#/components/schemas/PlayGroupOptions" }
        memberCount: { type: integer }
        followerCount: { type: integer }
        isMember: { type: boolean }
        role: { type: string, enum: [owner, admin, member], description: "The caller's role. Absent for a non-member." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        members: { type: array, items: { $ref: "#/components/schemas/PlayGroupMember" }, description: "Members only." }

    PlayGroupOptions:
      type: object
      description: >
        The group's own settings. For a non-member only `theme`, `links` and
        `rhythm` are returned - announcements, contents and streams belong to
        the showcase, which has its own operation.
      properties:
        theme: { $ref: "#/components/schemas/PlayGroupTheme" }
        links: { type: array, items: { $ref: "#/components/schemas/PlayGroupLink" } }
        rhythm: { $ref: "#/components/schemas/PlayGroupRhythm" }
        announcements: { type: array, items: { $ref: "#/components/schemas/PlayGroupAnnouncement" } }
        contents: { type: array, items: { $ref: "#/components/schemas/PlayGroupContent" } }
        lives: { type: array, items: { $ref: "#/components/schemas/PlayGroupLive" }, description: "At most 3." }

    PlayGroupTheme:
      type: object
      properties:
        logo: { type: string }
        banner: { type: string }
        accentColor: { type: string, description: "One of a closed five-value palette." }
        tagline: { type: string, description: "The line under the name on the showcase." }

    PlayGroupLink:
      type: object
      properties:
        type: { type: string, enum: [website, twitch, youtube, discord, instagram, facebook, x, other] }
        url: { type: string }
        label: { type: string }

    PlayGroupPlace:
      type: object
      description: >
        Where a session happens. A Joutes venue inherits its record - address,
        opening hours, directions - so only its id is needed; a free-form place
        is just a name and maybe a detail.
      properties:
        kind: { type: string, enum: [joutes, free, member] }
        lairId: { type: string, description: "Set for `kind: joutes` only." }
        label: { type: string }
        detail: { type: string }

    PlayGroupRhythm:
      type: object
      properties:
        label: { type: string, description: "Free text - \"Every Thursday at 19:30\"." }
        defaultPlace: { $ref: "#/components/schemas/PlayGroupPlace" }

    PlayGroupAnnouncement:
      type: object
      description: >
        Scope decides everything: `group` never leaves the group's own board,
        `public` is repeated on the showcase. There is no third state - a
        badly-scoped announcement is fixed by changing its scope.
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        scope: { type: string, enum: [group, public] }
        authorId: { type: string }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PlayGroupContent:
      type: object
      description: >
        An article carries its markdown body; a video or a replay carries a
        Twitch or YouTube url. One without the other is refused at write time.
      properties:
        id: { type: string }
        kind: { type: string, enum: [video, article, replay] }
        title: { type: string }
        summary: { type: string }
        body: { type: string, description: "Markdown - articles only." }
        url: { type: string }
        thumbnail: { type: string }
        duration: { type: string, description: "Shown as written - \"12 min\", \"1 h 04\"." }
        gameId: { type: string }
        authorId: { type: string }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PlayGroupLive:
      type: object
      description: >
        A member's ongoing stream. Nothing removes one automatically, so a
        stream declared more than 24 hours ago is dropped on read rather than
        pinning its group forever.
      properties:
        id: { type: string }
        title: { type: string }
        streamer: { type: string, description: "The member's display name - never their email." }
        gameName: { type: string, nullable: true }
        viewers: { type: integer, nullable: true }
        startedAt: { type: string, format: date-time }
        channelUrl: { type: string }
        platform: { type: string, enum: [twitch, youtube] }

    PlayGroupSessionSlot:
      type: object
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        voterIds: { type: array, items: { type: string } }

    PlayGroupRsvp:
      type: object
      properties:
        userId: { type: string }
        answer: { type: string, enum: [yes, maybe, no] }
        respondedAt: { type: string, format: date-time }

    PlayGroupSession:
      type: object
      description: >
        A poll and a confirmed session are the same object: a poll that gets
        settled *becomes* the session, keeping its identity and the
        availabilities already given. `slots` and `pollClosesAt` only exist
        while `status` is `poll`; `startsAt` only once confirmed.
      properties:
        id: { type: string }
        playGroupId: { type: string }
        title: { type: string }
        gameId: { type: string }
        status: { type: string, enum: [poll, confirmed, cancelled] }
        place: { $ref: "#/components/schemas/PlayGroupPlace" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        slots: { type: array, items: { $ref: "#/components/schemas/PlayGroupSessionSlot" } }
        pollClosesAt: { type: string, format: date-time }
        rsvps: { type: array, items: { $ref: "#/components/schemas/PlayGroupRsvp" } }
        eventId: { type: string }
        createdById: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PlayGroupSessionInput:
      type: object
      required: [title]
      description: >
        A session needs either a date (`startsAt`) or slots to poll - one of
        the two, or the request is refused.
      properties:
        title: { type: string, maxLength: 140 }
        gameId: { type: string }
        place: { $ref: "#/components/schemas/PlayGroupPlace" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        slots:
          type: array
          maxItems: 8
          items: { type: object, required: [startsAt], properties: { startsAt: { type: string, format: date-time } } }
        pollClosesAt: { type: string, format: date-time }

    PlayGroupAnnouncementInput:
      type: object
      required: [title, scope]
      properties:
        title: { type: string, minLength: 1, maxLength: 140 }
        body: { type: string, maxLength: 2000 }
        scope: { type: string, enum: [group, public] }

    PlayGroupContentInput:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [video, article, replay] }
        title: { type: string, minLength: 1, maxLength: 140 }
        summary: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 20000, description: "Required for `article`." }
        url: { type: string, maxLength: 2048, description: "Required for `video` and `replay`." }
        thumbnail: { type: string }
        duration: { type: string, maxLength: 20 }
        gameId: { type: string }

    PlayGroupFollowState:
      type: object
      properties:
        following: { type: boolean }
        followerCount: { type: integer }

    ExploreGroup:
      type: object
      description: One row of the roll, with everything the card shows.
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string, description: "Two letters at most, small words skipped." }
        visibility: { type: string, enum: [public, private] }
        tagline: { type: string, nullable: true }
        accentColor: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        rhythmLabel: { type: string, nullable: true }
        place: { $ref: "#/components/schemas/PlayGroupPlace" }
        placeCoordinates:
          type: object
          nullable: true
          description: "Only a Joutes venue carries geocoded coordinates."
          properties: { longitude: { type: number }, latitude: { type: number } }
        gameNames: { type: array, items: { type: string } }
        memberCount: { type: integer }
        followerCount: { type: integer }
        publishedCount: { type: integer }
        lives: { type: array, items: { $ref: "#/components/schemas/PlayGroupLive" } }
        lastDeed:
          type: object
          nullable: true
          description: "The latest sign of life other than a stream."
          properties:
            kind: { type: string, enum: [content, session, announcement] }
            at: { type: string, format: date-time }
            label: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        activityRank: { type: number }
        isFollowing: { type: boolean }

    PlayGroupInvitation:
      type: object
      properties:
        id: { type: string }
        playGroupId: { type: string }
        playGroupName: { type: string }
        invitedUserId: { type: string }
        invitedById: { type: string }
        status: { type: string, enum: [pending, accepted, declined] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CollectionCardInput:
      type: object
      required: [name, cardId, setCode, collectorNumber, image]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        cardId: { type: string, minLength: 1, maxLength: 100 }
        setCode: { type: string, minLength: 1, maxLength: 100 }
        collectorNumber: { type: string, minLength: 1, maxLength: 100 }
        image: { type: string }
        foil: { type: boolean }
        language: { type: string, enum: [FR, EN, ZH, IT, JA, KO] }
        condition: { type: string, enum: [Damaged, Played, Good, "Near Mint", Mint] }
        grade: { type: number, minimum: 0, maximum: 10 }
        obtainedAt: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        acquisitionPrice: { type: number, minimum: 0 }
        acquisitionCurrency: { type: string, enum: [EUR, USD, GBP, JPY, CNY] }

    CollectionCardEntry:
      type: object
      properties:
        id: { type: string }
        foil: { type: boolean }
        language: { type: string, enum: [FR, EN, ZH, IT, JA, KO] }
        condition: { type: string, enum: [Damaged, Played, Good, "Near Mint", Mint] }
        grade: { type: number }
        obtainedAt: { type: string }
        acquisitionPrice: { type: number }
        acquisitionCurrency: { type: string, enum: [EUR, USD, GBP, JPY, CNY] }
        borrowedBy: { type: string }
        forSale:
          type: object
          properties: { itemId: { type: string }, sellListId: { type: string }, price: { type: number }, currency: { type: string }, note: { type: string } }

    Booster:
      type: object
      properties:
        id: { type: string }
        gameId: { type: string }
        game: { type: object, properties: { id: { type: string }, slug: { type: string } } }
        userId: { type: string }
        setCode: { type: string }
        lang: { type: string }
        type: { type: string }
        cards: { type: array, items: { $ref: "#/components/schemas/BoosterCard" } }
        note: { type: string, description: Free-form note written by the booster's owner. }
        value: { type: string }
        archived: { type: boolean }
        addedToCollection: { type: boolean }
        createdAt: { type: string, format: date-time }

    Cube:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        gameId: { type: string }
        gameName: { type: string }
        gameSlug: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [private, unlisted, public] }
        draw:
          allOf:
            - $ref: "#/components/schemas/CubeDrawConfig"
          description: Absent until the owner configures the draw; the defaults apply then.
        packsCount:
          type: integer
          description: Recomputed on read, never stored on the cube.
        cardsCount:
          type: integer
          description: Recomputed on read, never stored on the cube.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CubePack:
      type: object
      properties:
        id: { type: string }
        cubeId: { type: string }
        name: { type: string, description: Absent when the pack was created without one. }
        type: { type: string }
        cardsCount: { type: integer }
        createdAt: { type: string, format: date-time }

    CubeCard:
      type: object
      description: >-
        One copy of a card in a pack. Only the card's identity is stored; game
        properties are read back from the game's cards for the statistics.
      properties:
        id: { type: string }
        cubeId: { type: string }
        packId: { type: string }
        cardId: { type: string }
        name: { type: string }
        setCode: { type: string }
        collectorNumber: { type: string }
        image: { type: string }
        orientation: { type: string, enum: [portrait, landscape], description: "Read back from the game's catalog on display; absent means `portrait`, and a landscape card is shown rotated a quarter turn." }
        createdAt: { type: string, format: date-time }

    CubeDrawRule:
      type: object
      description: One composition requirement, e.g. "3 cards of rarity Rare".
      properties:
        attribute:
          type: string
          description: Card attribute key as stored on the game's cards (`rarity`, `type`, `domain`...).
        value: { type: string }
        count: { type: integer, minimum: 1 }

    CubeDrawConfig:
      type: object
      required: [mode, packsPerPlayer, cardsPerPlayer, rules, allowDuplicates]
      properties:
        mode:
          type: string
          enum: [packs, random]
          description: >-
            `packs` hands out whole packs; `random` hands out loose cards taken
            from the whole cube.
        packsPerPlayer: { type: integer, minimum: 1, maximum: 20 }
        cardsPerPlayer: { type: integer, minimum: 1, maximum: 200 }
        rules:
          type: array
          maxItems: 12
          description: >-
            `random` mode only. Rules are served first and their total may not
            exceed `cardsPerPlayer`; the remainder is filled at random.
          items: { $ref: "#/components/schemas/CubeDrawRule" }
        allowDuplicates:
          type: boolean
          description: >-
            Lets the same pack or card entry reach several players. A single
            player never receives the same copy twice, whatever this value.

    CubeDrawnCard:
      type: object
      description: >-
        A card as handed out by a draw. Lighter than CubeCard: the draw only
        carries the card's identity, not its cube, pack or creation date.
      properties:
        id: { type: string, description: Id of the cube's card entry the copy comes from. }
        cardId: { type: string }
        name: { type: string }
        setCode: { type: string }
        collectorNumber: { type: string }
        image: { type: string }
        orientation: { type: string, enum: [portrait, landscape], description: "Read back from the game's catalog on display; absent means `portrait`, and a landscape card is shown rotated a quarter turn." }

    CubeDrawnPack:
      type: object
      properties:
        id: { type: string }
        name: { type: string, description: Absent when the pack has no name. }
        type: { type: string }
        index:
          type: integer
          description: The pack's rank in the cube, used to label unnamed packs.
        cards: { type: array, items: { $ref: "#/components/schemas/CubeDrawnCard" } }

    CubeDrawResult:
      type: object
      properties:
        config: { $ref: "#/components/schemas/CubeDrawConfig" }
        players:
          type: array
          items:
            type: object
            properties:
              player: { type: integer, description: 1-based position of the player. }
              packs: { type: array, items: { $ref: "#/components/schemas/CubeDrawnPack" } }
              cards: { type: array, items: { $ref: "#/components/schemas/CubeDrawnCard" } }
        shortfalls:
          type: array
          description: >-
            What the cube could not supply. The draw is still returned, short of
            the request, rather than failing.
          items:
            type: object
            properties:
              reason: { type: string, enum: [packs, cards, rule] }
              attribute: { type: string }
              value: { type: string }
              requested: { type: integer }
              provided: { type: integer }

    SetCompletion:
      type: object
      properties:
        setCode: { type: string }
        masterOwned: { type: integer }
        masterTotal: { type: integer }
        gameOwned: { type: integer }
        gameTotal: { type: integer }

    GameCollectionStats:
      type: object
      nullable: true
      properties:
        gameId: { type: string }
        name: { type: string }
        slug: { type: string }
        icon: { type: string }
        color: { type: string }
        type: { type: string }
        copies: { type: integer }
        masterOwned: { type: integer }
        masterTotal: { type: integer }
        gameOwned: { type: integer }
        gameTotal: { type: integer }
        sets: { type: array, items: { $ref: "#/components/schemas/SetCompletion" } }
        value: { $ref: "#/components/schemas/CollectionValue" }

    CollectionValue:
      type: object
      description: >
        Estimated market value of a collection, computed on demand and stored:
        it only moves when the owner asks for it, which is what makes it
        comparable from one month to the next. Absent when it has never been
        computed. `pricedCopies` says how many copies actually carried a price —
        a total backed by 200 copies out of 1000 does not read like the price of
        the collection.
      required: [amount, currency, copies, pricedCopies, computedAt]
      properties:
        amount: { type: number }
        currency: { type: string, description: "ISO 4217 code (`EUR`)." }
        copies: { type: integer, description: "Copies owned at computation time." }
        pricedCopies: { type: integer }
        computedAt: { type: string, format: date-time }
        games:
          type: integer
          description: "Whole-collection total only: how many games it is made of. Its date is the oldest of theirs."

    CollectionOverview:
      type: object
      properties:
        totalCopies: { type: integer }
        masterOwned: { type: integer }
        masterTotal: { type: integer }
        gameOwned: { type: integer }
        gameTotal: { type: integer }
        gamesWithItems: { type: integer }
        games: { type: array, items: { $ref: "#/components/schemas/GameCollectionStats" } }
        productGames:
          type: array
          items: { $ref: "#/components/schemas/ProductCollectionStats" }
          description: "Progress on games that have a product catalogue (miniature games)."
        totalProductCopies: { type: integer }
        productsOwned: { type: integer }
        productsTotal: { type: integer }
        value:
          allOf: [{ $ref: "#/components/schemas/CollectionValue" }]
          description: "Whole-collection value: the sum of the per-game ones, dated from the oldest. Products are not in it — a miniature has no price reading."

    ProductSetCompletion:
      type: object
      properties:
        setCode: { type: string }
        productsOwned: { type: integer }
        productsTotal: { type: integer }
        unitsOwned: { type: integer }
        unitsTotal: { type: integer }

    ProductCollectionStats:
      type: object
      nullable: true
      properties:
        gameId: { type: string }
        name: { type: string }
        slug: { type: string }
        icon: { type: string }
        color: { type: string }
        type: { type: string }
        edition:
          type: string
          description: >
            Edition these numbers cover — the game's current one unless another
            was asked for. Absent means the whole catalogue, all editions
            together. Completion is counted one edition at a time: a range that
            changes edition is not collected from scratch.
        copies: { type: integer, description: "Copies owned, all products taken together." }
        productsOwned: { type: integer }
        productsTotal: { type: integer }
        unitsOwned: { type: integer, description: "Distinct leaf products (miniatures) owned; boxes excluded." }
        unitsTotal: { type: integer }
        paintedCopies: { type: integer }
        paintableCopies: { type: integer, description: "Copies of leaf products, the denominator of the painting ratio." }
        sets: { type: array, items: { $ref: "#/components/schemas/ProductSetCompletion" } }

    ProductContent:
      type: object
      properties:
        productId: { type: string }
        quantity: { type: integer }

    ContentCompletion:
      type: object
      description: >
        Completion counted in *references*, not units: a box of eight miniatures
        of which two are identical reads 7/7.
      properties:
        owned: { type: integer }
        total: { type: integer }
        complete: { type: boolean }

    ProductCollectionItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [box, unit, starter, bundle, accessory, book, other] }
        setCode: { type: string }
        edition: { type: string, description: "Game edition the product belongs to, when the range has editions." }
        image: { type: string }
        contents: { type: array, items: { $ref: "#/components/schemas/ProductContent" } }
        quantity: { type: integer }
        content:
          allOf:
            - $ref: "#/components/schemas/ContentCompletion"
          description: >
            Completion of this product's contents across the whole collection,
            regardless of which box brought them. Meaningful even for a product
            the caller does not own — you may already own everything inside it.

    ProductCollectionResult:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProductCollectionItem" } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }
        setCodes: { type: array, items: { type: string } }
        editions: { type: array, items: { type: string }, description: "Editions present in the catalogue, sorted by label in reverse alphabetical order. Empty when the game has none." }
        facets: { type: array, items: { $ref: "#/components/schemas/ProductFilterFacet" }, description: "Filterable attributes carried by the game's products; what `min_*`, `max_*` and `in_*` accept." }
        stats: { $ref: "#/components/schemas/ProductCollectionStats" }

    ProductFilterFacet:
      type: object
      description: >
        A filterable product attribute, read off the catalogue rather than
        declared: a min-max range when the attribute is numeric, a list of values
        otherwise. The `edition` attribute, booleans, attributes with more than
        forty distinct values and those with a single one are left out.
      properties:
        key: { type: string, description: "Attribute key, as stored under `attributes`." }
        type: { type: string, enum: [number, value] }
        min: { type: number, description: "Numeric facets only." }
        max: { type: number, description: "Numeric facets only." }
        values: { type: array, items: { type: string }, description: "Value facets only." }

    CollectionProductInput:
      type: object
      required: [productId]
      description: >
        Only the product id is sent: name, image, kind and range are read back
        from the catalogue server-side.
      properties:
        productId: { type: string }
        addContents:
          type: boolean
          description: "Also add the product's contents (default `true`). No effect on a product without contents."
        contents:
          type: array
          items: { type: string }
          description: "Subset of the contents to add, when the buyer is missing part of a second-hand box. Absent means all of it."
        paintState: { type: string, enum: [unassembled, assembled, primed, partial, painted, based] }
        sealed: { type: boolean }
        obtainedAt: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        acquisitionPrice: { type: number, minimum: 0 }
        acquisitionCurrency: { type: string, enum: [EUR, USD, GBP, JPY, CNY] }
        note: { type: string, maxLength: 200 }

    CollectionProductPatch:
      type: object
      description: "A `null` value clears the field. `detach` is one-way: there is no re-attach."
      properties:
        paintState: { type: string, enum: [unassembled, assembled, primed, partial, painted, based], nullable: true }
        sealed: { type: boolean, description: "Unsealing a container also unseals what it brought and is still sealed." }
        obtainedAt: { type: string, nullable: true }
        acquisitionPrice: { type: number, nullable: true }
        acquisitionCurrency: { type: string, enum: [EUR, USD, GBP, JPY, CNY], nullable: true }
        note: { type: string, nullable: true }
        borrowedBy: { type: string, nullable: true }
        detach: { type: boolean, enum: [true], description: "Take this copy out of the box that brought it; it will survive that box's removal." }

    GameMatchPlayer:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        discriminator: { type: string }
        isGuest: { type: boolean, description: "Participant without an account: their id opens no access." }
        isWinner: { type: boolean }

    GameMatchSummary:
      type: object
      properties:
        id: { type: string }
        playedAt: { type: string, format: date-time }
        createdBy: { type: string }
        game: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string }, slug: { type: string, nullable: true } } }
        lair: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        players: { type: array, items: { $ref: "#/components/schemas/GameMatchPlayer" } }
        winnerIds: { type: array, items: { type: string } }
        battleReport:
          type: object
          description: "Present = the match is recorded as a battle report. Trimmed to its scenario in lists."
          properties: { scenario: { type: string } }

    BattleReportArmyUnit:
      type: object
      properties:
        productId: { type: string, description: "Catalogue miniature; absent for a free-form entry." }
        name: { type: string, description: "Denormalized: it survives the product's disappearance." }
        image: { type: string }
        quantity: { type: integer }

    BattleReportArmy:
      type: object
      properties:
        name: { type: string }
        units: { type: array, items: { $ref: "#/components/schemas/BattleReportArmyUnit" } }

    BattleMapTerrain:
      type: object
      description: "A piece of terrain. Everything is in centimetres, `x`/`y` being the centre."
      properties:
        id: { type: string }
        shape: { type: string, enum: [circle, rectangle, triangle] }
        name: { type: string }
        color: { type: string, example: "#000000" }
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }

    BattleMapUnitToken:
      type: object
      description: "A unit token: always round, in its player's colour, tied to a line of their army list."
      properties:
        id: { type: string }
        playerId: { type: string }
        unitName: { type: string }
        productId: { type: string }
        image: { type: string }
        x: { type: number }
        y: { type: number }
        diameter: { type: number, description: "Base diameter, in centimetres." }

    BattleMapSnapshot:
      type: object
      description: "One instant of the game — « start of play », « end of turn 2 »."
      properties:
        id: { type: string }
        label: { type: string }
        units: { type: array, items: { $ref: "#/components/schemas/BattleMapUnitToken" } }

    BattleMap:
      type: object
      description: >
        The table seen from above. Terrain belongs to the table, units to the
        instant: terrain does not move during a game, and copying it into every
        instant would mean correcting it everywhere.
      properties:
        table:
          type: object
          description: "Board size, in centimetres."
          properties: { width: { type: number }, height: { type: number } }
        terrain: { type: array, items: { $ref: "#/components/schemas/BattleMapTerrain" } }
        snapshots: { type: array, items: { $ref: "#/components/schemas/BattleMapSnapshot" } }
        playerColors: { type: object, additionalProperties: { type: string } }

    BattleReport:
      type: object
      properties:
        scenario: { type: string }
        notes: { type: string }
        armies: { type: object, additionalProperties: { $ref: "#/components/schemas/BattleReportArmy" } }
        map: { $ref: "#/components/schemas/BattleMap" }

    GameMatchDetail:
      allOf:
        - $ref: "#/components/schemas/GameMatchSummary"
        - type: object
          properties:
            battleReport: { $ref: "#/components/schemas/BattleReport" }

    SellList:
      type: object
      properties:
        id: { type: string }
        ownerType: { type: string, enum: [user, playGroup] }
        ownerId: { type: string }
        description: { type: string }
        itemsCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SellListItemInput:
      type: object
      required: [collectionEntryId, gameSlug]
      additionalProperties: false
      properties:
        collectionEntryId: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        gameSlug: { type: string, minLength: 1, maxLength: 100 }
        price: { type: number, minimum: 0, maximum: 1000000 }
        currency: { type: string, enum: [EUR, USD, GBP, JPY, CNY], description: "Required if price is set." }
        note: { type: string, maxLength: 300 }

    SellListItem:
      type: object
      properties:
        id: { type: string }
        sellListId: { type: string }
        collectionEntryId: { type: string }
        cardId: { type: string }
        gameId: { type: string }
        gameName: { type: string }
        gameSlug: { type: string }
        name: { type: string }
        setCode: { type: string }
        collectorNumber: { type: string }
        image: { type: string }
        type: { type: string }
        orientation: { type: string, enum: [portrait, landscape], description: "Read back from the game's catalog on display; absent means `portrait`, and a landscape card is shown rotated a quarter turn." }
        foil: { type: boolean }
        language: { type: string, enum: [FR, EN, ZH, IT, JA, KO] }
        condition: { type: string, enum: [Damaged, Played, Good, "Near Mint", Mint] }
        grade: { type: number }
        price: { type: number }
        currency: { type: string, enum: [EUR, USD, GBP, JPY, CNY] }
        note: { type: string }
        addedByUserId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Wishlist:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        ownerType: { type: string, enum: [user, playGroup] }
        ownerId: { type: string }
        visibility: { type: string, enum: [private, unlisted, public] }
        itemsCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WishlistItem:
      type: object
      properties:
        id: { type: string }
        wishlistId: { type: string }
        cardId: { type: string }
        gameId: { type: string }
        gameName: { type: string }
        gameSlug: { type: string }
        name: { type: string }
        setCode: { type: string }
        collectorNumber: { type: string }
        image: { type: string }
        type: { type: string }
        orientation: { type: string, enum: [portrait, landscape], description: "Read back from the game's catalog on display; absent means `portrait`, and a landscape card is shown rotated a quarter turn." }
        quantity: { type: integer }
        note: { type: string }
        addedByUserId: { type: string }
        createdAt: { type: string, format: date-time }
        ownedQuantity: { type: integer, description: "Only populated on the list endpoint, reflecting the current viewer's own collection." }
